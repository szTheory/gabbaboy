name: fixture-repro

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-repro:
    name: fixture-repro
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download pinned RGBDS release
        shell: bash
        run: |
          rgbds_pin=$(python3 <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path.cwd()
          visible = json.loads((root / 'fixtures/visible-demo/manifest.json').read_text())
          tracer = json.loads((root / 'fixtures/tracer/manifest.json').read_text())
          continuation = json.loads((root / 'fixtures/mbc1-continuation/manifest.json').read_text())
          banking = json.loads((root / 'fixtures/mbc5-banking/manifest.json').read_text())
          cgb_banking = json.loads((root / 'fixtures/cgb-banking/manifest.json').read_text())
          cgb_colour = json.loads((root / 'fixtures/cgb-colour/manifest.json').read_text())
          cgb_speed = json.loads((root / 'fixtures/cgb-speed/manifest.json').read_text())
          age = json.loads((root / 'fixtures/age/manifest.json').read_text())
          samesuite = json.loads((root / 'fixtures/samesuite/manifest.json').read_text())
          guests = {
              'MBC3+RTC continuation': json.loads((root / 'fixtures/mbc3-rtc-continuation/manifest.json').read_text()),
              'MBC2 continuation': json.loads((root / 'fixtures/mbc2-continuation/manifest.json').read_text()),
              'MBC5 continuation': json.loads((root / 'fixtures/mbc5-continuation/manifest.json').read_text()),
          }
          build = visible['build']
          tracer_build = tracer['build']
          continuation_build = continuation['build']
          banking_build = banking['build']
          cgb_banking_build = cgb_banking['build']
          cgb_colour_build = cgb_colour['build']
          cgb_speed_build = cgb_speed['build']
          age_build = age['build']
          samesuite_build = samesuite['build']
          if build.get('version') != '1.0.1' or build.get('version') != tracer_build.get('version'):
              raise SystemExit('visible demo RGBDS version differs from the established v1.0.1 pin')
          if build.get('version') != continuation_build.get('version'):
              raise SystemExit('MBC1 continuation RGBDS version differs from the established v1.0.1 pin')
          if build.get('version') != banking_build.get('version'):
              raise SystemExit('MBC5 banking RGBDS version differs from the established v1.0.1 pin')
          if (build.get('archive'), build.get('archive_sha256')) != (
                  tracer_build.get('archive'), tracer_build.get('archive_sha256')):
              raise SystemExit('visible demo macOS RGBDS archive differs from the established tracer pin')
          if (build.get('archive'), build.get('archive_sha256')) != (
                  continuation_build.get('archive'), continuation_build.get('archive_sha256')):
              raise SystemExit('MBC1 continuation macOS RGBDS archive differs from the established fixture pin')
          if (build.get('archive'), build.get('archive_sha256')) != (
                  banking_build.get('archive'), banking_build.get('archive_sha256')):
              raise SystemExit('MBC5 banking macOS RGBDS archive differs from the established fixture pin')
          if (build.get('ci_archive'), build.get('ci_archive_sha256')) != (
                  banking_build.get('ci_archive'), banking_build.get('ci_archive_sha256')):
              raise SystemExit('MBC5 banking Linux RGBDS archive differs from the established fixture pin')
          for key in ('version', 'archive', 'archive_sha256', 'ci_archive', 'ci_archive_sha256'):
              if build.get(key) != cgb_banking_build.get(key):
                  raise SystemExit(f'CGB banking RGBDS pin {key} differs from the established fixture pin')
          for key in ('version', 'archive', 'archive_sha256', 'ci_archive', 'ci_archive_sha256'):
              if build.get(key) != cgb_colour_build.get(key):
                  raise SystemExit(f'CGB colour RGBDS pin {key} differs from the established fixture pin')
          for key in ('version', 'archive', 'archive_sha256', 'ci_archive', 'ci_archive_sha256'):
              if build.get(key) != cgb_speed_build.get(key):
                  raise SystemExit(f'CGB speed RGBDS pin {key} differs from the established fixture pin')
          for key in ('version', 'archive', 'archive_sha256', 'ci_archive', 'ci_archive_sha256'):
              if age_build.get(key) != cgb_colour_build.get(key):
                  raise SystemExit(f'AGE RGBDS pin {key} differs from the established fixture pin')
          for key in ('version', 'archive', 'archive_sha256', 'ci_archive', 'ci_archive_sha256'):
              if samesuite_build.get(key) != cgb_colour_build.get(key):
                  raise SystemExit(f'SameSuite RGBDS pin {key} differs from the established fixture pin')
          for guest_name, guest in guests.items():
              guest_build = guest['build']
              if build.get('version') != guest_build.get('version'):
                  raise SystemExit(f'{guest_name} RGBDS version differs from the established v1.0.1 pin')
              if (build.get('archive'), build.get('archive_sha256')) != (
                      guest_build.get('archive'), guest_build.get('archive_sha256')):
                  raise SystemExit(f'{guest_name} macOS RGBDS archive differs from the established fixture pin')
              if (build.get('ci_archive'), build.get('ci_archive_sha256')) != (
                      guest_build.get('ci_archive'), guest_build.get('ci_archive_sha256')):
                  raise SystemExit(f'{guest_name} Linux RGBDS archive differs from the established fixture pin')
          archive = build.get('ci_archive')
          digest = build.get('ci_archive_sha256')
          if archive != 'rgbds-linux-x86_64.tar.xz':
              raise SystemExit('unexpected Linux RGBDS archive name')
          if digest != '80a5cad8dae27e24e46a93041352c47cadbc165103983f41c2b3082c42f6dad9':
              raise SystemExit('Linux RGBDS archive digest differs from the reviewed v1.0.1 pin')
          if not re.fullmatch(r'[0-9a-f]{64}', digest):
              raise SystemExit('invalid Linux RGBDS archive digest')
          print(f'{build["version"]}\t{archive}\t{digest}')
          PY
          )
          IFS=$'\t' read -r RGBDS_RELEASE_VERSION RGBDS_ARCHIVE RGBDS_ARCHIVE_SHA256 <<< "$rgbds_pin"
          [[ -n "$RGBDS_RELEASE_VERSION" && -n "$RGBDS_ARCHIVE" && -n "$RGBDS_ARCHIVE_SHA256" ]]
          release_dir="$RUNNER_TEMP/rgbds-$RGBDS_RELEASE_VERSION"
          mkdir -p "$release_dir"
          {
            printf 'RGBDS_RELEASE_VERSION=%s\n' "$RGBDS_RELEASE_VERSION"
            printf 'RGBDS_ARCHIVE=%s\n' "$RGBDS_ARCHIVE"
            printf 'RGBDS_ARCHIVE_SHA256=%s\n' "$RGBDS_ARCHIVE_SHA256"
          } >> "$GITHUB_ENV"
          curl --fail --location --silent --show-error \
            "https://github.com/gbdev/rgbds/releases/download/v$RGBDS_RELEASE_VERSION/$RGBDS_ARCHIVE" \
            -o "$release_dir/$RGBDS_ARCHIVE"
          printf '%s  %s\n' \
            "$RGBDS_ARCHIVE_SHA256" "$release_dir/$RGBDS_ARCHIVE" | sha256sum --check --status
          tar -xJf "$release_dir/$RGBDS_ARCHIVE" -C "$release_dir"
          echo "$release_dir" >> "$GITHUB_PATH"
      - name: Confirm assembler version and reproduce fixture bytes
        run: |
          rgbasm --version | grep -F 'rgbasm v1.0.1'
          rgbasm -o "$RUNNER_TEMP/tracer.o" fixtures/tracer/tracer.asm
          rgblink -o "$RUNNER_TEMP/tracer.gb" "$RUNNER_TEMP/tracer.o"
          rgbfix -f hg -p 0 -m 0 -r 0 "$RUNNER_TEMP/tracer.gb"
          cmp fixtures/tracer/tracer.gb "$RUNNER_TEMP/tracer.gb"
          expected=$(sed -nE 's/.*"sha256": "([0-9a-f]{64})".*/\1/p' fixtures/tracer/manifest.json | head -n 1)
          actual=$(sha256sum "$RUNNER_TEMP/tracer.gb" | cut -d ' ' -f 1)
          [[ -n "$expected" && "$actual" == "$expected" ]]
      - name: Reproduce visible demo and write exact-revision receipt
        shell: bash
        env:
          GBB_EXPECTED_SOURCE_REVISION: ${{ github.sha }}
          GBB_REPRO_RECEIPT: ${{ runner.temp }}/visible-demo-receipt.json
          GBB_EXPECTED_TEST: visible-demo-source-byte-reproduction
          GBB_REPRO_COMMAND: bash tests/scripts/reproduce-visible-demo.sh
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          expected_test="$GBB_EXPECTED_TEST"
          reproduction_command="$GBB_REPRO_COMMAND"
          [[ -n "$expected_test" && -n "$reproduction_command" ]]
          test -s tests/expected-tests.txt
          GBB_RGBDS_ARCHIVE="$RUNNER_TEMP/rgbds-$RGBDS_RELEASE_VERSION/$RGBDS_ARCHIVE" \
            GBB_RGBDS_ARCHIVE_SHA256="$RGBDS_ARCHIVE_SHA256" \
            bash tests/scripts/reproduce-visible-demo.sh
      - name: Reproduce MBC1 battery continuation fixture bytes
        shell: bash
        run: |
          test -s tests/expected-tests.txt
          GBB_RGBDS_ARCHIVE="$RUNNER_TEMP/rgbds-$RGBDS_RELEASE_VERSION/$RGBDS_ARCHIVE" \
            GBB_RGBDS_ARCHIVE_SHA256="$RGBDS_ARCHIVE_SHA256" \
            bash tests/scripts/reproduce-mbc1-continuation.sh
      - name: Reproduce MBC5 banking fixture bytes
        shell: bash
        run: |
          test -s tests/expected-tests.txt
          GBB_RGBDS_ARCHIVE="$RUNNER_TEMP/rgbds-$RGBDS_RELEASE_VERSION/$RGBDS_ARCHIVE" \
            GBB_RGBDS_ARCHIVE_SHA256="$RGBDS_ARCHIVE_SHA256" \
            bash tests/scripts/reproduce-mbc5-banking.sh
      - name: Reproduce CGB banking fixture bytes
        shell: bash
        run: |
          GBB_RGBDS_ARCHIVE="$RUNNER_TEMP/rgbds-$RGBDS_RELEASE_VERSION/$RGBDS_ARCHIVE" \
            GBB_RGBDS_ARCHIVE_SHA256="$RGBDS_ARCHIVE_SHA256" \
            bash tests/scripts/reproduce-cgb-banking.sh
      - name: Reproduce CGB colour fixture bytes
        shell: bash
        run: |
          GBB_RGBDS_ARCHIVE="$RUNNER_TEMP/rgbds-$RGBDS_RELEASE_VERSION/$RGBDS_ARCHIVE" \
            GBB_RGBDS_ARCHIVE_SHA256="$RGBDS_ARCHIVE_SHA256" \
            bash tests/scripts/reproduce-cgb-colour.sh
      - name: Reproduce original CGB HDMA guest and negative controls
        shell: bash
        run: |
          export GBB_RGBDS_ARCHIVE="$RUNNER_TEMP/rgbds-$RGBDS_RELEASE_VERSION/$RGBDS_ARCHIVE"
          export GBB_RGBDS_ARCHIVE_SHA256="$RGBDS_ARCHIVE_SHA256"
          bash tests/scripts/reproduce-cgb-hdma.sh --self-check
          bash tests/scripts/reproduce-cgb-hdma.sh --self-test
          bash tests/scripts/reproduce-cgb-hdma.sh --compare-pinned
      - name: Reproduce CGB speed fixture bytes
        shell: bash
        run: |
          GBB_RGBDS_ARCHIVE="$RUNNER_TEMP/rgbds-$RGBDS_RELEASE_VERSION/$RGBDS_ARCHIVE" \
            GBB_RGBDS_ARCHIVE_SHA256="$RGBDS_ARCHIVE_SHA256" \
            bash tests/scripts/reproduce-cgb-speed.sh
      - name: Reproduce AGE test ROM bytes
        shell: bash
        run: |
          GBB_RGBDS_ARCHIVE="$RUNNER_TEMP/rgbds-$RGBDS_RELEASE_VERSION/$RGBDS_ARCHIVE" \
            GBB_RGBDS_ARCHIVE_SHA256="$RGBDS_ARCHIVE_SHA256" \
            bash tests/scripts/reproduce-age.sh --compare
          bash tests/scripts/test-reproduce-age.sh compare-tampered
          bash tests/scripts/test-reproduce-age.sh selfcheck-tampered
      - name: Reproduce all approved SameSuite DMA fixture bytes
        shell: bash
        run: |
          GBB_RGBDS_ARCHIVE="$RUNNER_TEMP/rgbds-$RGBDS_RELEASE_VERSION/$RGBDS_ARCHIVE" \
            GBB_RGBDS_ARCHIVE_SHA256="$RGBDS_ARCHIVE_SHA256" \
            GBB_SAMESUITE_BUILD_DIR="$RUNNER_TEMP/samesuite-built" \
            bash tests/scripts/reproduce-samesuite.sh
          bash tests/scripts/reproduce-samesuite.sh --compare-built "$RUNNER_TEMP/samesuite-built"
      - name: Reproduce MBC3+RTC battery continuation fixture bytes
        shell: bash
        run: |
          test -s tests/expected-tests.txt
          GBB_RGBDS_ARCHIVE="$RUNNER_TEMP/rgbds-$RGBDS_RELEASE_VERSION/$RGBDS_ARCHIVE" \
            GBB_RGBDS_ARCHIVE_SHA256="$RGBDS_ARCHIVE_SHA256" \
            bash tests/scripts/reproduce-mbc3-rtc-continuation.sh
      - name: Reproduce MBC2 battery continuation fixture bytes
        shell: bash
        run: |
          test -s tests/expected-tests.txt
          GBB_RGBDS_ARCHIVE="$RUNNER_TEMP/rgbds-$RGBDS_RELEASE_VERSION/$RGBDS_ARCHIVE" \
            GBB_RGBDS_ARCHIVE_SHA256="$RGBDS_ARCHIVE_SHA256" \
            bash tests/scripts/reproduce-mbc2-continuation.sh
      - name: Reproduce MBC5 battery continuation fixture bytes
        shell: bash
        run: |
          test -s tests/expected-tests.txt
          GBB_RGBDS_ARCHIVE="$RUNNER_TEMP/rgbds-$RGBDS_RELEASE_VERSION/$RGBDS_ARCHIVE" \
            GBB_RGBDS_ARCHIVE_SHA256="$RGBDS_ARCHIVE_SHA256" \
            bash tests/scripts/reproduce-mbc5-continuation.sh
      - name: Retain visible demo identity receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visible-demo-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visible-demo-receipt.json
          if-no-files-found: error
          retention-days: 30

  mooneye-original-repro:
    name: mooneye-original-repro
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Diagnose immutable upstream-built Mooneye ROM bytes
        shell: bash
        env:
          GBB_REPRO_OUTPUT_DIR: ${{ runner.temp }}/mooneye-evidence
        run: bash tests/scripts/reproduce-mooneye.sh --diagnose fixtures/mooneye
      - name: Retain immutable-original reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mooneye-original-evidence
          path: |
            ${{ runner.temp }}/mooneye-evidence/inputs.txt
            ${{ runner.temp }}/mooneye-evidence/cmake-configure.log
            ${{ runner.temp }}/mooneye-evidence/cmake-build.log
            ${{ runner.temp }}/mooneye-evidence/daa
            ${{ runner.temp }}/mooneye-evidence/tim00
            ${{ runner.temp }}/mooneye-evidence/tim00_div_trigger
          if-no-files-found: warn
          retention-days: 30

  mooneye-candidate-repro:
    name: mooneye-candidate-repro
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Stage bounded source and rights identities
        shell: bash
        run: |
          provenance="$RUNNER_TEMP/mooneye-candidate-evidence/provenance"
          mkdir -p "$provenance"
          cp fixtures/mooneye/manifest.json fixtures/mooneye/pre-admission-baseline.json \
            fixtures/mooneye/headless-report.patch fixtures/mooneye/font-source.c \
            fixtures/mooneye/LICENSE.txt fixtures/mooneye/FONT-LICENSE.txt \
            fixtures/mooneye/ELIGIBILITY.md fixtures/mooneye/SOURCES.md "$provenance/"
      - name: Compare the three derived candidates against the provisional lock
        shell: bash
        env:
          GBB_REPRO_OUTPUT_DIR: ${{ runner.temp }}/mooneye-candidate-evidence
          GBB_WLA_ORDERING_STRATEGY: source-order
        run: bash tests/scripts/reproduce-mooneye.sh --candidate-compare fixtures/mooneye
      - name: Retain exact-SHA candidate ROMs, reports, and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mooneye-candidate-evidence
          path: |
            ${{ runner.temp }}/mooneye-candidate-evidence
          if-no-files-found: error
          retention-days: 30

  mooneye-mbc-repro:
    name: mooneye-mbc-repro
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rebuild the 15 sibling derivatives and compare them with the committed ROMs
        shell: bash
        env:
          GBB_REPRO_OUTPUT_DIR: ${{ runner.temp }}/mooneye-mbc-evidence
          GBB_WLA_ORDERING_STRATEGY: source-order
        run: bash tests/scripts/reproduce-mooneye-mbc.sh --compare fixtures/mooneye-mbc
      - name: Retain exact-SHA sibling ROM rebuild evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mooneye-mbc-evidence
          path: |
            ${{ runner.temp }}/mooneye-mbc-evidence
          if-no-files-found: warn
          retention-days: 30

  mooneye-cgb-repro:
    name: mooneye-cgb-repro
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rebuild all nine selected CGB ROMs and compare them with the committed ROMs
        shell: bash
        env:
          GBB_REPRO_OUTPUT_DIR: ${{ runner.temp }}/mooneye-cgb-evidence
          GBB_WLA_ORDERING_STRATEGY: source-order
        run: bash tests/scripts/reproduce-mooneye-cgb.sh --compare fixtures/mooneye-cgb
      - name: Retain exact-SHA CGB ROM rebuild evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mooneye-cgb-evidence
          path: |
            ${{ runner.temp }}/mooneye-cgb-evidence
          if-no-files-found: warn
          retention-days: 30

  magentests-repro:
    name: magentests-repro
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download pinned RGBDS v0.6.1 release
        shell: bash
        run: |
          archive=rgbds-0.6.1-linux-x86_64.tar.xz
          digest=$(sed -nE "s/^$archive sha256 ([0-9a-f]{64})\$/\1/p" fixtures/magentests/SOURCES.md)
          [[ -n "$digest" ]]
          release_dir="$RUNNER_TEMP/rgbds-0.6.1"
          mkdir -p "$release_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/gbdev/rgbds/releases/download/v0.6.1/$archive" \
            -o "$release_dir/$archive"
          printf '%s  %s\n' "$digest" "$release_dir/$archive" | sha256sum --check --status
          tar -xJf "$release_dir/$archive" -C "$release_dir"
          echo "$release_dir" >> "$GITHUB_PATH"
      - name: Rebuild the MagenTests ROMs and compare them with the committed bytes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/magentests-evidence"
          bash tests/scripts/reproduce-magentests.sh --compare | tee "$RUNNER_TEMP/magentests-evidence/result.txt"
      - name: Retain MagenTests rebuild result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: magentests-repro-result
          path: ${{ runner.temp }}/magentests-evidence/result.txt
          if-no-files-found: warn
          retention-days: 30

  rtc3test-repro:
    name: rtc3test-repro
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install RGBDS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex libpng-dev pkg-config
      - name: Build pinned RGBDS v0.4.2 from source
        shell: bash
        run: |
          rgbds_commit=ede982b50a68a6253ffbab17dc4184710b08032f
          src="$RUNNER_TEMP/rgbds-src"
          bin_dir="$RUNNER_TEMP/rgbds-0.4.2-bin"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/gbdev/rgbds.git "$rgbds_commit"
          git -C "$src" checkout -q FETCH_HEAD
          [[ "$(git -C "$src" rev-parse HEAD)" == "$rgbds_commit" ]]
          make -C "$src" -j"$(nproc)"
          mkdir -p "$bin_dir"
          cp "$src/rgbasm" "$src/rgblink" "$src/rgbfix" "$bin_dir/"
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Rebuild rtc3test and compare it with the committed ROM
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rtc3test-evidence"
          bash tests/scripts/reproduce-rtc3test.sh --compare | tee "$RUNNER_TEMP/rtc3test-evidence/result.txt"
      - name: Retain rtc3test rebuild result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rtc3test-repro-result
          path: ${{ runner.temp }}/rtc3test-evidence/result.txt
          if-no-files-found: warn
          retention-days: 30
