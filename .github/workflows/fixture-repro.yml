name: fixture-repro

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-repro:
    name: fixture-repro
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download pinned RGBDS release
        shell: bash
        run: |
          rgbds_pin=$(python3 <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path.cwd()
          visible = json.loads((root / 'fixtures/visible-demo/manifest.json').read_text())
          tracer = json.loads((root / 'fixtures/tracer/manifest.json').read_text())
          build = visible['build']
          tracer_build = tracer['build']
          if build.get('version') != '1.0.1' or build.get('version') != tracer_build.get('version'):
              raise SystemExit('visible demo RGBDS version differs from the established v1.0.1 pin')
          if (build.get('archive'), build.get('archive_sha256')) != (
                  tracer_build.get('archive'), tracer_build.get('archive_sha256')):
              raise SystemExit('visible demo macOS RGBDS archive differs from the established tracer pin')
          archive = build.get('ci_archive')
          digest = build.get('ci_archive_sha256')
          if archive != 'rgbds-linux-x86_64.tar.xz':
              raise SystemExit('unexpected Linux RGBDS archive name')
          if digest != '80a5cad8dae27e24e46a93041352c47cadbc165103983f41c2b3082c42f6dad9':
              raise SystemExit('Linux RGBDS archive digest differs from the reviewed v1.0.1 pin')
          if not re.fullmatch(r'[0-9a-f]{64}', digest):
              raise SystemExit('invalid Linux RGBDS archive digest')
          print(f'{build["version"]}\t{archive}\t{digest}')
          PY
          )
          IFS=$'\t' read -r RGBDS_RELEASE_VERSION RGBDS_ARCHIVE RGBDS_ARCHIVE_SHA256 <<< "$rgbds_pin"
          [[ -n "$RGBDS_RELEASE_VERSION" && -n "$RGBDS_ARCHIVE" && -n "$RGBDS_ARCHIVE_SHA256" ]]
          release_dir="$RUNNER_TEMP/rgbds-$RGBDS_RELEASE_VERSION"
          mkdir -p "$release_dir"
          {
            printf 'RGBDS_RELEASE_VERSION=%s\n' "$RGBDS_RELEASE_VERSION"
            printf 'RGBDS_ARCHIVE=%s\n' "$RGBDS_ARCHIVE"
            printf 'RGBDS_ARCHIVE_SHA256=%s\n' "$RGBDS_ARCHIVE_SHA256"
          } >> "$GITHUB_ENV"
          curl --fail --location --silent --show-error \
            "https://github.com/gbdev/rgbds/releases/download/v$RGBDS_RELEASE_VERSION/$RGBDS_ARCHIVE" \
            -o "$release_dir/$RGBDS_ARCHIVE"
          printf '%s  %s\n' \
            "$RGBDS_ARCHIVE_SHA256" "$release_dir/$RGBDS_ARCHIVE" | sha256sum --check --status
          tar -xJf "$release_dir/$RGBDS_ARCHIVE" -C "$release_dir"
          echo "$release_dir" >> "$GITHUB_PATH"
      - name: Confirm assembler version and reproduce fixture bytes
        run: |
          rgbasm --version | grep -F 'rgbasm v1.0.1'
          rgbasm -o "$RUNNER_TEMP/tracer.o" fixtures/tracer/tracer.asm
          rgblink -o "$RUNNER_TEMP/tracer.gb" "$RUNNER_TEMP/tracer.o"
          rgbfix -f hg -p 0 -m 0 -r 0 "$RUNNER_TEMP/tracer.gb"
          cmp fixtures/tracer/tracer.gb "$RUNNER_TEMP/tracer.gb"
          expected=$(sed -nE 's/.*"sha256": "([0-9a-f]{64})".*/\1/p' fixtures/tracer/manifest.json | head -n 1)
          actual=$(sha256sum "$RUNNER_TEMP/tracer.gb" | cut -d ' ' -f 1)
          [[ -n "$expected" && "$actual" == "$expected" ]]
      - name: Reproduce visible demo and write exact-revision receipt
        shell: bash
        env:
          GBB_EXPECTED_SOURCE_REVISION: ${{ github.sha }}
          GBB_REPRO_RECEIPT: ${{ runner.temp }}/visible-demo-receipt.json
          GBB_EXPECTED_TEST: visible-demo-source-byte-reproduction
          GBB_REPRO_COMMAND: bash tests/scripts/reproduce-visible-demo.sh
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          expected_test="$GBB_EXPECTED_TEST"
          reproduction_command="$GBB_REPRO_COMMAND"
          [[ -n "$expected_test" && -n "$reproduction_command" ]]
          test -s tests/expected-tests.txt
          GBB_RGBDS_ARCHIVE="$RUNNER_TEMP/rgbds-$RGBDS_RELEASE_VERSION/$RGBDS_ARCHIVE" \
            GBB_RGBDS_ARCHIVE_SHA256="$RGBDS_ARCHIVE_SHA256" \
            bash tests/scripts/reproduce-visible-demo.sh
      - name: Retain visible demo identity receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visible-demo-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visible-demo-receipt.json
          if-no-files-found: error
          retention-days: 30

  mooneye-original-repro:
    name: mooneye-original-repro
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Diagnose immutable upstream-built Mooneye ROM bytes
        shell: bash
        env:
          GBB_REPRO_OUTPUT_DIR: ${{ runner.temp }}/mooneye-evidence
        run: bash tests/scripts/reproduce-mooneye.sh --diagnose fixtures/mooneye
      - name: Retain immutable-original reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mooneye-original-evidence
          path: |
            ${{ runner.temp }}/mooneye-evidence/inputs.txt
            ${{ runner.temp }}/mooneye-evidence/cmake-configure.log
            ${{ runner.temp }}/mooneye-evidence/cmake-build.log
            ${{ runner.temp }}/mooneye-evidence/daa
            ${{ runner.temp }}/mooneye-evidence/tim00
            ${{ runner.temp }}/mooneye-evidence/tim00_div_trigger
          if-no-files-found: warn
          retention-days: 30

  mooneye-candidate-repro:
    name: mooneye-candidate-repro
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Stage bounded source and rights identities
        shell: bash
        run: |
          provenance="$RUNNER_TEMP/mooneye-candidate-evidence/provenance"
          mkdir -p "$provenance"
          cp fixtures/mooneye/manifest.json fixtures/mooneye/pre-admission-baseline.json \
            fixtures/mooneye/headless-report.patch fixtures/mooneye/font-source.c \
            fixtures/mooneye/LICENSE.txt fixtures/mooneye/FONT-LICENSE.txt \
            fixtures/mooneye/ELIGIBILITY.md fixtures/mooneye/SOURCES.md "$provenance/"
      - name: Compare the three derived candidates against the provisional lock
        shell: bash
        env:
          GBB_REPRO_OUTPUT_DIR: ${{ runner.temp }}/mooneye-candidate-evidence
          GBB_WLA_ORDERING_STRATEGY: source-order
        run: bash tests/scripts/reproduce-mooneye.sh --candidate-compare fixtures/mooneye
      - name: Retain exact-SHA candidate ROMs, reports, and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mooneye-candidate-evidence
          path: |
            ${{ runner.temp }}/mooneye-candidate-evidence
          if-no-files-found: error
          retention-days: 30
