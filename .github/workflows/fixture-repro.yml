name: fixture-repro

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  fixture-repro:
    name: fixture-repro
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download pinned RGBDS release
        run: |
          release_dir="$RUNNER_TEMP/rgbds-1.0.1"
          mkdir -p "$release_dir"
          curl --fail --location --silent --show-error \
            https://github.com/gbdev/rgbds/releases/download/v1.0.1/rgbds-linux-x86_64.tar.xz \
            -o "$release_dir/rgbds-linux-x86_64.tar.xz"
          printf '%s  %s\n' \
            '80a5cad8dae27e24e46a93041352c47cadbc165103983f41c2b3082c42f6dad9' \
            "$release_dir/rgbds-linux-x86_64.tar.xz" | sha256sum --check --status
          tar -xJf "$release_dir/rgbds-linux-x86_64.tar.xz" -C "$release_dir"
          echo "$release_dir" >> "$GITHUB_PATH"
      - name: Confirm assembler version and reproduce fixture bytes
        run: |
          rgbasm --version | grep -F 'rgbasm v1.0.1'
          rgbasm -o "$RUNNER_TEMP/tracer.o" fixtures/tracer/tracer.asm
          rgblink -o "$RUNNER_TEMP/tracer.gb" "$RUNNER_TEMP/tracer.o"
          rgbfix -f hg -p 0 -m 0 -r 0 "$RUNNER_TEMP/tracer.gb"
          cmp fixtures/tracer/tracer.gb "$RUNNER_TEMP/tracer.gb"
          expected=$(sed -nE 's/.*"sha256": "([0-9a-f]{64})".*/\1/p' fixtures/tracer/manifest.json | head -n 1)
          actual=$(sha256sum "$RUNNER_TEMP/tracer.gb" | cut -d ' ' -f 1)
          [[ -n "$expected" && "$actual" == "$expected" ]]
