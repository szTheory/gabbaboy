name: fixture-repro

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-repro:
    name: fixture-repro
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download pinned RGBDS release
        run: |
          release_dir="$RUNNER_TEMP/rgbds-1.0.1"
          mkdir -p "$release_dir"
          curl --fail --location --silent --show-error \
            https://github.com/gbdev/rgbds/releases/download/v1.0.1/rgbds-linux-x86_64.tar.xz \
            -o "$release_dir/rgbds-linux-x86_64.tar.xz"
          printf '%s  %s\n' \
            '80a5cad8dae27e24e46a93041352c47cadbc165103983f41c2b3082c42f6dad9' \
            "$release_dir/rgbds-linux-x86_64.tar.xz" | sha256sum --check --status
          tar -xJf "$release_dir/rgbds-linux-x86_64.tar.xz" -C "$release_dir"
          echo "$release_dir" >> "$GITHUB_PATH"
      - name: Confirm assembler version and reproduce fixture bytes
        run: |
          rgbasm --version | grep -F 'rgbasm v1.0.1'
          rgbasm -o "$RUNNER_TEMP/tracer.o" fixtures/tracer/tracer.asm
          rgblink -o "$RUNNER_TEMP/tracer.gb" "$RUNNER_TEMP/tracer.o"
          rgbfix -f hg -p 0 -m 0 -r 0 "$RUNNER_TEMP/tracer.gb"
          cmp fixtures/tracer/tracer.gb "$RUNNER_TEMP/tracer.gb"
          expected=$(sed -nE 's/.*"sha256": "([0-9a-f]{64})".*/\1/p' fixtures/tracer/manifest.json | head -n 1)
          actual=$(sha256sum "$RUNNER_TEMP/tracer.gb" | cut -d ' ' -f 1)
          [[ -n "$expected" && "$actual" == "$expected" ]]

  mooneye-fixture-repro:
    name: mooneye-fixture-repro
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch and verify pinned WLA-DX source
        shell: bash
        run: |
          set -euo pipefail
          revision=91c52b1f4ef3cc8ba3c0638f7536539579af6a9f
          git_dir="$RUNNER_TEMP/wla-dx-git"
          mkdir -p "$git_dir"
          git -C "$git_dir" init -q
          git -C "$git_dir" remote add origin https://github.com/vhelin/wla-dx.git
          git -C "$git_dir" fetch --depth=1 origin "$revision"
          git -C "$git_dir" checkout --detach FETCH_HEAD
          [[ "$(git -C "$git_dir" rev-parse HEAD)" == "$revision" ]]
          archive_sha=24a95d77a79feeb70d1de87d66749c006e37337308ce9c00e44efac4c46ab976
          archive="$RUNNER_TEMP/wla-dx-source.tar"
          git -C "$git_dir" archive --output="$archive" HEAD
          printf '%s  %s\n' "$archive_sha" "$archive" | sha256sum --check
          wla_source_dir="$RUNNER_TEMP/wla-dx-source"
          mkdir -p "$wla_source_dir"
          tar -xf "$archive" -C "$wla_source_dir"
      - name: Fetch the pinned Mooneye fixture source
        shell: bash
        run: |
          set -euo pipefail
          revision=31510e12eea6286d36eea060a6adde755e1067aa
          git_dir="$RUNNER_TEMP/mooneye-git"
          mkdir -p "$git_dir"
          git -C "$git_dir" init -q
          git -C "$git_dir" remote add origin https://github.com/Gekkio/mooneye-test-suite.git
          git -C "$git_dir" fetch --depth=1 origin "$revision"
          git -C "$git_dir" checkout --detach FETCH_HEAD
          [[ "$(git -C "$git_dir" rev-parse HEAD)" == "$revision" ]]
          source_dir="$RUNNER_TEMP/mooneye-source"
          mkdir -p "$source_dir"
          git -C "$git_dir" archive --output="$RUNNER_TEMP/mooneye-source.tar" HEAD
          tar -xf "$RUNNER_TEMP/mooneye-source.tar" -C "$source_dir"
      - name: Build pinned assembler and reproduce all eligible ROM bytes
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/wla-dx-source"
          build_dir="$RUNNER_TEMP/wla-dx-build"
          install_dir="$RUNNER_TEMP/wla-dx-install"
          cmake -S "$source_dir" -B "$build_dir" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$install_dir"
          cmake --build "$build_dir" --config Release --target wla-gb wlalink -j4
          assembler="$build_dir/binaries/wla-gb"
          linker="$build_dir/binaries/wlalink"
          assembler_version=$("$assembler" 2>&1 || true)
          linker_version=$("$linker" 2>&1 || true)
          grep -F 'wla-gb 10.7 (28.6.2026)' <<<"$assembler_version"
          grep -F 'wlalink 5.22 (28.6.2026)' <<<"$linker_version"

          fixture_dir="$GITHUB_WORKSPACE/fixtures/mooneye"
          upstream_common="$RUNNER_TEMP/mooneye-source/common"
          mooneye_source="$RUNNER_TEMP/mooneye-source"
          build_root="$RUNNER_TEMP/mooneye-build"
          cc -std=c17 -O2 "$fixture_dir/font-source.c" -o "$RUNNER_TEMP/font-source"
          "$RUNNER_TEMP/font-source" "$upstream_common/font.bin"
          printf '%s  %s\n' \
            '23ba65cb93433b65e7ddcae5f8a7dd2ca232491793848644e625875c6dd6ae43' \
            "$upstream_common/font.bin" | sha256sum --check

          for case_name in daa tim00 tim00_div_trigger; do
            case "$case_name" in
              daa) source_path=acceptance/instr/daa.s ;;
              tim00|tim00_div_trigger) source_path="acceptance/timer/$case_name.s" ;;
            esac
            object="$build_root/${source_path%.s}.o"
            link_file="$build_root/${source_path%.s}.link"
            rom="$RUNNER_TEMP/$case_name.gb"
            mkdir -p "$(dirname "$object")"
            "$assembler" -I "$upstream_common" -o "$object" "$mooneye_source/$source_path"
            printf '[objects]\n%s\n' "$object" > "$link_file"
            "$linker" -d -S "$link_file" "$rom"
            cmp "$fixture_dir/$case_name.gb" "$rom"
            expected=$(jq -r --arg rom "$case_name.gb" '.fixtures[] | select(.rom == $rom) | .sha256' "$fixture_dir/manifest.json")
            actual=$(sha256sum "$rom" | awk '{print $1}')
            [[ -n "$expected" && "$actual" == "$expected" ]]
            echo "Reproduced $case_name.gb ($actual)"
          done
