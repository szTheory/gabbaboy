name: preview-package-smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read

env:
  PREVIEW_RETENTION_DAYS: 14

jobs:
  installed-package-smoke-linux-x64:
    name: installed-package-smoke-linux-x64
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Verify matching successful required CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          deadline=$((SECONDS + 1500))
          ci_run_id=
          while (( SECONDS < deadline )); do
            ci_run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${EXPECTED_SHA}&event=pull_request&per_page=20" \
              --jq ".workflow_runs | map(select(.head_sha == \"${EXPECTED_SHA}\" and .event == \"pull_request\")) | sort_by(.run_number) | last | .id // empty")
            if [[ -n "$ci_run_id" && "$ci_run_id" != null ]]; then
              status=$(gh run view "$ci_run_id" --json status --jq '.status')
              if [[ "$status" == completed ]]; then
                passed=$(gh run view "$ci_run_id" --json conclusion,headSha,event,jobs --jq ".conclusion == \"success\" and .headSha == \"${EXPECTED_SHA}\" and .event == \"pull_request\" and any(.jobs[]; .name == \"required-native\" and .conclusion == \"success\")")
                [[ "$passed" == true ]] || {
                  echo "The exact pull-request CI run did not pass required-native for $EXPECTED_SHA." >&2
                  exit 1
                }
                exit 0
              fi
            fi
            sleep 10
          done
          echo "No completed successful pull-request CI run for $EXPECTED_SHA appeared within 25 minutes." >&2
          exit 1
      - name: Check out tested source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Configure, build, and install
        run: |
          cmake --preset phase1
          cmake --build --preset phase1 --verbose
          cmake --install build --prefix build/preview-stage
      - name: Smoke extracted archive and external consumers
        run: ctest --test-dir build --output-on-failure --no-tests=error -R '^preview_package_smoke$'
      - name: Write package evidence sidecar
        run: |
          archive=build/preview-package-smoke/installed-prefix.tar.gz
          digest=$(cmake -E sha256sum "$archive" | cut -d ' ' -f 1)
          mkdir -p build/preview-artifact
          cp "$archive" build/preview-artifact/gabbaboy-preview-linux-x64.tar.gz
          cat > build/preview-artifact/artifact-metadata.json <<EOF
          {
            "source_sha": "${{ github.event.pull_request.head.sha }}",
            "package_sha256": "$digest",
            "smoke_result": "passed",
            "capability_limits": "Bootless DMG-CPU-B core with standard MBC1, bounded battery API, and 48 kHz signed 16-bit stereo audio API; this Linux package has no SDL player or device playback and does not qualify CGB or physical hardware",
            "retention_days": $PREVIEW_RETENTION_DAYS
          }
          EOF
      - name: Upload run-scoped Linux preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-linux-x64
          path: build/preview-artifact/*
          retention-days: ${{ env.PREVIEW_RETENTION_DAYS }}
          if-no-files-found: error

  installed-package-smoke-macos-arm64:
    name: installed-package-smoke-macos-arm64
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Verify matching successful required CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          deadline=$((SECONDS + 1500))
          ci_run_id=
          while (( SECONDS < deadline )); do
            ci_run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${EXPECTED_SHA}&event=pull_request&per_page=20" \
              --jq ".workflow_runs | map(select(.head_sha == \"${EXPECTED_SHA}\" and .event == \"pull_request\")) | sort_by(.run_number) | last | .id // empty")
            if [[ -n "$ci_run_id" && "$ci_run_id" != null ]]; then
              status=$(gh run view "$ci_run_id" --json status --jq '.status')
              if [[ "$status" == completed ]]; then
                passed=$(gh run view "$ci_run_id" --json conclusion,headSha,event,jobs --jq ".conclusion == \"success\" and .headSha == \"${EXPECTED_SHA}\" and .event == \"pull_request\" and any(.jobs[]; .name == \"required-native\" and .conclusion == \"success\")")
                [[ "$passed" == true ]] || {
                  echo "The exact pull-request CI run did not pass required-native for $EXPECTED_SHA." >&2
                  exit 1
                }
                exit 0
              fi
            fi
            sleep 10
          done
          echo "No completed successful pull-request CI run for $EXPECTED_SHA appeared within 25 minutes." >&2
          exit 1
      - name: Check out tested source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Configure, build, and install
        run: |
          cmake --preset phase1
          cmake --build --preset phase1 --verbose
          cmake --install build --prefix build/preview-stage
      - name: Smoke extracted archive and external consumers
        run: ctest --test-dir build --output-on-failure --no-tests=error -R '^preview_package_smoke$'
      - name: Write package evidence sidecar
        run: |
          archive=build/preview-package-smoke/installed-prefix.tar.gz
          digest=$(cmake -E sha256sum "$archive" | cut -d ' ' -f 1)
          mkdir -p build/preview-artifact
          cp "$archive" build/preview-artifact/gabbaboy-preview-macos-arm64.tar.gz
          cat > build/preview-artifact/artifact-metadata.json <<EOF
          {
            "source_sha": "${{ github.event.pull_request.head.sha }}",
            "package_sha256": "$digest",
            "smoke_result": "passed",
            "capability_limits": "Bootless DMG-CPU-B core and SDL3 player with scoped 48 kHz signed 16-bit stereo DMG audio, standard MBC1, and bounded battery API; no boot ROM, CGB, physical/revision audio qualification, or listening-quality claim",
            "retention_days": $PREVIEW_RETENTION_DAYS
          }
          EOF
      - name: Upload run-scoped macOS preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-macos-arm64
          path: build/preview-artifact/*
          retention-days: ${{ env.PREVIEW_RETENTION_DAYS }}
          if-no-files-found: error

  player-package-smoke-macos:
    name: player-package-smoke-macos
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Find the exact successful player build run
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Expected PR head is not a full Git SHA." >&2
            exit 1
          }
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${EXPECTED_SHA}&event=pull_request&per_page=20" \
              --jq ".workflow_runs | map(select(.head_sha == \"${EXPECTED_SHA}\" and .event == \"pull_request\")) | sort_by(.run_number) | reverse | .[].id")
            while IFS= read -r run_id; do
              [[ -n "$run_id" ]] || continue
              run=$(gh run view "$run_id" --json status,conclusion,headSha,event,attempt,jobs)
              status=$(jq -r '.status' <<<"$run")
              [[ "$status" == completed ]] || continue
              player_result=$(jq -r '[.jobs[] | select(.name == "macos-player-package")][0].conclusion // "missing"' <<<"$run")
              required_result=$(jq -r '[.jobs[] | select(.name == "required-native")][0].conclusion // "missing"' <<<"$run")
              if [[ "$player_result" == success && "$required_result" == success ]]; then
                source_sha=$(jq -r '.headSha' <<<"$run")
                event=$(jq -r '.event' <<<"$run")
                [[ "$source_sha" == "$EXPECTED_SHA" && "$event" == pull_request ]] || {
                  echo "Selected CI run is not for the exact pull-request head." >&2
                  exit 1
                }
                printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
                printf 'run_attempt=%s\n' "$(jq -r '.attempt' <<<"$run")" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [[ "$player_result" == failure || "$player_result" == cancelled || "$player_result" == timed_out || "$player_result" == action_required ]]; then
                echo "Required player package job failed in exact-head CI run $run_id ($player_result)." >&2
                exit 1
              fi
              if [[ "$required_result" == failure || "$required_result" == cancelled || "$required_result" == timed_out || "$required_result" == action_required ]]; then
                echo "Required CI aggregate failed in exact-head run $run_id ($required_result)." >&2
                exit 1
              fi
            done <<<"$runs"
            sleep 10
          done
          echo "No exact-head pull-request CI run completed the player package and required-native checks within 30 minutes." >&2
          exit 1
      - name: Check out exact pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Download run-scoped candidate package
        env:
          GH_TOKEN: ${{ github.token }}
          GBB_BUILD_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          GBB_BUILD_RUN_ATTEMPT: ${{ steps.candidate.outputs.run_attempt }}
        run: |
          gh run download "$GBB_BUILD_RUN_ID" \
            --name "phase3-player-candidate-${GBB_BUILD_RUN_ID}-${GBB_BUILD_RUN_ATTEMPT}" \
            --dir "$RUNNER_TEMP/player-candidate"
      - name: Verify downloaded package bytes and create consumer receipt
        env:
          GBB_EXPECTED_SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
          GBB_EXPECTED_BUILD_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          GBB_EXPECTED_BUILD_RUN_ATTEMPT: ${{ steps.candidate.outputs.run_attempt }}
          GBB_VERIFIED_OUTPUT_DIR: ${{ runner.temp }}/verified-player-artifact
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash tests/scripts/verify-phase3-player.sh --verify-package "$RUNNER_TEMP/player-candidate"
      - name: Upload qualified macOS player preview and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-player-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-player-artifact/*
          retention-days: ${{ env.PREVIEW_RETENTION_DAYS }}
          if-no-files-found: error

  preview-package-smoke:
    name: preview-package-smoke
    if: always()
    needs:
      - installed-package-smoke-linux-x64
      - installed-package-smoke-macos-arm64
      - player-package-smoke-macos
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Reject missing or failed platform package smoke jobs
        env:
          LINUX_X64: ${{ needs.installed-package-smoke-linux-x64.result }}
          MACOS_ARM64: ${{ needs.installed-package-smoke-macos-arm64.result }}
          PLAYER_REQUESTED: ${{ github.event_name == 'pull_request' }}
          PLAYER_RESULT: ${{ needs.player-package-smoke-macos.result }}
        run: |
          for result in "$LINUX_X64" "$MACOS_ARM64"; do
            if [[ "$result" != success ]]; then
              echo "Required preview package smoke did not succeed: $result" >&2
              exit 1
            fi
          done
          if [[ "$PLAYER_REQUESTED" == true && "$PLAYER_RESULT" != success ]]; then
            echo "Required downloaded macOS player package verification did not succeed: $PLAYER_RESULT" >&2
            exit 1
          fi
          if [[ "$PLAYER_REQUESTED" != true && "$PLAYER_RESULT" != skipped && "$PLAYER_RESULT" != success ]]; then
            echo "Unexpected optional macOS player verification result: $PLAYER_RESULT" >&2
            exit 1
          fi
          echo "Required exact-revision installed package smokes succeeded."
