name: release-candidate-workflow

on:
  workflow_call:
    inputs:
      retry:
        type: boolean
        required: false
        default: false
      tag_name:
        type: string
        required: false
        default: ''
      source_sha:
        type: string
        required: false
        default: ''
      release_id:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: gabbaboy-release-${{ inputs.retry && inputs.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  # This deliberately uses GITHUB_TOKEN. Its PR events do not start later
  # workflows; the repository's normal approval gate must release those exact-
  # head CI checks before the version PR can merge.
  release:
    if: ${{ inputs.retry != true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Require trusted repository main branch
        env:
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
        run: |
          [[ "$GH_REPO" == szTheory/gabbaboy && "$GH_REF" == refs/heads/main ]] || {
            echo "Release automation runs only for trusted pushes to szTheory/gabbaboy main." >&2
            exit 1
          }
      - name: Create version PR or unpublished draft and immediate tag
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  candidate:
    name: downloaded-linux-x64-candidate
    needs: [release]
    if: ${{ always() && ((inputs.retry == true) || (needs.release.result == 'success' && needs.release.outputs.release_created == 'true')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
      RETRY: ${{ inputs.retry }}
      INPUT_TAG: ${{ inputs.tag_name }}
      INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
      INPUT_RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_TAG: ${{ inputs.retry && inputs.tag_name || needs.release.outputs.tag_name }}
      SOURCE_SHA: ${{ inputs.retry && inputs.source_sha || needs.release.outputs.sha }}
      RELEASE_NOTES_OUTPUT: ${{ needs.release.outputs.release_created }}
    steps:
      - name: Require trusted repository, main workflow ref, and exact tag identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GH_REPO" == szTheory/gabbaboy && "$GITHUB_REF" == refs/heads/main ]] || {
            echo "Candidate builds run only from trusted main workflow runs." >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Missing or malformed release-please tag/source output." >&2
            exit 1
          }
          if [[ "$RETRY" == true ]]; then
            [[ "$INPUT_RELEASE_ID" =~ ^[0-9]+$ ]] || { echo "Retry requires an existing draft release ID." >&2; exit 1; }
          else
            [[ "$RELEASE_NOTES_OUTPUT" == true ]] || { echo "release_created was not true." >&2; exit 1; }
          fi
          api_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
          [[ "$api_commit" == "$SOURCE_SHA" ]] || { echo "Trusted tag does not resolve to the exact release-please source SHA." >&2; exit 1; }
          release_json=$(gh api "repos/$GH_REPO/releases?per_page=100")
          matches=$(jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | length' <<<"$release_json")
          [[ "$matches" == 1 ]] || { echo "Expected exactly one existing draft for $RELEASE_TAG, found $matches." >&2; exit 1; }
          release_id=$(jq --arg tag "$RELEASE_TAG" -r '.[] | select(.tag_name == $tag) | .id' <<<"$release_json")
          draft=$(jq --arg tag "$RELEASE_TAG" -r '.[] | select(.tag_name == $tag) | .draft' <<<"$release_json")
          body=$(jq --arg tag "$RELEASE_TAG" -r '.[] | select(.tag_name == $tag) | .body' <<<"$release_json")
          [[ "$draft" == true && -n "$body" && "$body" != null ]] || { echo "Matching release is published or lacks release notes." >&2; exit 1; }
          if [[ "$RETRY" == true && "$release_id" != "$INPUT_RELEASE_ID" ]]; then
            echo "Retry release ID differs from the supplied existing draft." >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          notes_file="$RUNNER_TEMP/release-metadata-notes.txt"
          printf '%s\n' "$body" > "$notes_file"
          echo "release_notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          version=${RELEASE_TAG#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check out exact tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load trusted control-plane receipt verifier
        shell: bash
        run: |
          set -euo pipefail
          git show "${GITHUB_SHA}:.github/scripts/verify-release-gates.sh" > "$RUNNER_TEMP/verify-release-gates.sh"
          chmod +x "$RUNNER_TEMP/verify-release-gates.sh"
      - name: Require final release notes to satisfy the v0.2 adoption contract
        env:
          RELEASE_NOTES_FILE: ${{ steps.identity.outputs.release_notes_file }}
        shell: bash
        run: python3 -I tests/scripts/verify-v02-adoption.py --release-notes "$RELEASE_NOTES_FILE"
      - name: Verify merged PR exact-head required evidence
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prs=$(gh api "repos/$GH_REPO/commits/$SOURCE_SHA/pulls")
          count=$(jq '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == env.SOURCE_SHA)] | length' <<<"$prs")
          [[ "$count" == 1 ]] || { echo "Tagged source does not map to exactly one merged main PR." >&2; exit 1; }
          pr=$(jq -c '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == env.SOURCE_SHA)][0]' <<<"$prs")
          pr_number=$(jq -r '.number' <<<"$pr")
          pr_head=$(jq -r '.head.sha' <<<"$pr")
          pr_merge=$(jq -r '.merge_commit_sha' <<<"$pr")
          [[ "$pr_merge" == "$SOURCE_SHA" && "$pr_head" =~ ^[0-9a-f]{40}$ ]] || { echo "Merged PR evidence has stale or malformed SHA fields." >&2; exit 1; }
          required=$(gh pr checks "$pr_number" --required --json name,bucket)
          [[ $(jq 'length' <<<"$required") -gt 0 ]] || { echo "No required checks were found." >&2; exit 1; }
          [[ $(jq 'all(.[]; .bucket == "pass")' <<<"$required") == true ]] || { echo "A required check is missing, skipped, stale, or failing." >&2; exit 1; }
          for context in required-native preview-package-smoke; do
            [[ $(jq --arg name "$context" 'any(.[]; .name == $name and .bucket == "pass")' <<<"$required") == true ]] || { echo "Required exact-head context missing: $context" >&2; exit 1; }
          done
          [[ $(jq 'any(.[]; (.name | endswith("fixture-repro")) and .bucket == "pass")' <<<"$required") == true ]] || { echo "Required exact-head fixture-repro context missing." >&2; exit 1; }
          printf 'head_sha=%s\nmerge_commit_sha=%s\npr_number=%s\n' "$pr_head" "$pr_merge" "$pr_number" >> "$GITHUB_OUTPUT"
      - name: Record or revalidate source identity receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_NOTES_FILE: ${{ steps.identity.outputs.release_notes_file }}
          PR_HEAD_SHA: ${{ steps.proof.outputs.head_sha }}
          PR_MERGE_SHA: ${{ steps.proof.outputs.merge_commit_sha }}
          PR_NUMBER: ${{ steps.proof.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" && -z "$(git status --porcelain --untracked-files=all)" ]] || {
            echo "Tagged source checkout is not clean and exact." >&2
            exit 1
          }
          mkdir -p build
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          notes = pathlib.Path(os.environ["RELEASE_NOTES_FILE"]).read_text()
          notice_sha = hashlib.sha256(pathlib.Path("LICENSE").read_bytes()).hexdigest()
          receipt = {
              "schema_version": 1,
              "version": os.environ["RELEASE_VERSION"],
              "tag_name": os.environ["RELEASE_TAG"],
              "source_sha": os.environ["SOURCE_SHA"],
              "release_id": os.environ["RELEASE_ID"],
              "draft": True,
              "source_clean": True,
              "notice_sha256": notice_sha,
              "release_notes": notes,
              "release_notes_sha256": hashlib.sha256(notes.encode()).hexdigest(),
              "prior_pr_proof": {
                  "head_sha": os.environ["PR_HEAD_SHA"],
                  "merge_commit_sha": os.environ["PR_MERGE_SHA"],
                  "pr_number": int(os.environ["PR_NUMBER"]),
                  "required_checks": "passed",
              },
          }
          pathlib.Path("build/source-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
          assets=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100")
          count=$(jq '[.[] | select(.name == "source-receipt.json")] | length' <<<"$assets")
          [[ "$count" -le 1 ]] || { echo "Draft has duplicate source identity receipts." >&2; exit 1; }
          if [[ "$count" == 1 ]]; then
            mkdir -p build/existing
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern source-receipt.json --dir build/existing
            cmp -s build/source-receipt.json build/existing/source-receipt.json || { echo "Existing source receipt differs." >&2; exit 1; }
            cp build/existing/source-receipt.json build/source-receipt.json
          else
            gh release upload "$RELEASE_TAG" build/source-receipt.json --repo "$GH_REPO"
          fi
      - name: Overlay the trusted release-candidate verifiers from the workflow commit
        shell: bash
        run: |
          set -euo pipefail
          # These control-plane verifiers judge the tagged data but must not be frozen at the tag: the
          # v0.2.0 tag shipped a product-package check that rejected the real package layout and could
          # not be repaired afterwards. Run the workflow commit's copies; the producers stay tagged.
          git show "${GITHUB_SHA}:tests/scripts/verify-release-candidate.sh" > tests/scripts/verify-release-candidate.sh
          git show "${GITHUB_SHA}:tests/scripts/verify-v02-source-archive.py" > tests/scripts/verify-v02-source-archive.py
          git show "${GITHUB_SHA}:tests/scripts/verify-v02-consumers.py" > tests/scripts/verify-v02-consumers.py
          git show "${GITHUB_SHA}:cmake/VerifyReleaseReceipt.cmake" > cmake/VerifyReleaseReceipt.cmake
      - name: Fetch a previously qualified candidate before retry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100")
          receipt_count=$(jq '[.[] | select(.name == "candidate-receipt.json")] | length' <<<"$assets")
          [[ "$receipt_count" -le 1 ]] || { echo "Draft has duplicate candidate receipts." >&2; exit 1; }
          if [[ "$receipt_count" == 1 ]]; then
            for name in gabbaboy-core-linux-x64.tar.gz gabbaboy-notices.txt source-receipt.json build-receipt.json; do
              count=$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' <<<"$assets")
              [[ "$count" == 1 ]] || { echo "Qualified receipt exists without exactly one $name attachment." >&2; exit 1; }
            done
            mkdir -p build/reuse
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
              --pattern candidate-receipt.json --pattern gabbaboy-core-linux-x64.tar.gz \
              --pattern gabbaboy-notices.txt --pattern source-receipt.json \
              --pattern build-receipt.json --dir build/reuse
            echo CANDIDATE_REUSED=true >> "$GITHUB_ENV"
          else
            echo CANDIDATE_REUSED=false >> "$GITHUB_ENV"
          fi
      - name: Revalidate a previously qualified candidate before retry
        env:
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_NOTES_FILE: ${{ steps.identity.outputs.release_notes_file }}
          PR_HEAD_SHA: ${{ steps.proof.outputs.head_sha }}
          PR_MERGE_SHA: ${{ steps.proof.outputs.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CANDIDATE_REUSED" == true ]]; then
            bash tests/scripts/verify-release-candidate.sh --verify \
              build/reuse/candidate-receipt.json build/reuse/gabbaboy-core-linux-x64.tar.gz \
              "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA" "$RELEASE_ID" \
              build/reuse/gabbaboy-notices.txt build/reuse/source-receipt.json \
              build/reuse/build-receipt.json
            python3 - build/reuse/candidate-receipt.json "$RELEASE_NOTES_FILE" <<'PY'
          import hashlib, json, os, pathlib, sys
          receipt = json.loads(pathlib.Path(sys.argv[1]).read_text())
          proof = receipt.get("prior_pr_proof", {})
          if proof.get("head_sha") != os.environ["PR_HEAD_SHA"] or proof.get("merge_commit_sha") != os.environ["PR_MERGE_SHA"]:
              raise SystemExit("Stored receipt has different exact-head PR evidence.")
          notes_sha = hashlib.sha256(pathlib.Path(sys.argv[2]).read_bytes()).hexdigest()
          notice_sha = hashlib.sha256(pathlib.Path("build/reuse/gabbaboy-notices.txt").read_bytes()).hexdigest()
          if receipt.get("release_notes_sha256") != notes_sha or receipt.get("notice_sha256") != notice_sha:
              raise SystemExit("Stored receipt does not match current release notes/notices.")
          PY
          fi
      - name: Configure and build cache-free release core
        if: env.CANDIDATE_REUSED != 'true'
        env:
          RELEASE_VERSION_OUT: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DGABBABOY_BUILD_PLAYER=OFF
          source_version=$(sed -nE 's/^project\(GabbaBoy VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n 1)
          [[ "$source_version" == "$RELEASE_VERSION_OUT" ]] || {
            echo "CMake PROJECT_VERSION does not match the release tag." >&2
            exit 1
          }
          cmake --build build/release --parallel 2
          cmake --install build/release --prefix build/release-stage
          mkdir -p build/release-stage/share/gabbaboy
          cp LICENSE build/release-stage/share/gabbaboy/LICENSE.txt
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$SOURCE_SHA")
          export SOURCE_DATE_EPOCH
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -czf build/gabbaboy-core-linux-x64.tar.gz -C build/release-stage include lib bin share
      - name: Write the build receipt for the cache-free archive
        if: env.CANDIDATE_REUSED != 'true'
        env:
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          asset_sha=$(sha256sum build/gabbaboy-core-linux-x64.tar.gz | cut -d ' ' -f1)
          source_receipt_sha=$(sha256sum build/source-receipt.json | cut -d ' ' -f1)
          tracer_sha=$(sha256sum fixtures/tracer/manifest.json | cut -d ' ' -f1)
          battery_sha=$(sha256sum fixtures/mbc1-continuation/manifest.json | cut -d ' ' -f1)
          compiler=$(cc --version | head -n1)
          cmake_version=$(cmake --version | head -n1)
          runner="ubuntu-22.04/${ImageOS:-unknown}/${ImageVersion:-unknown}"
          export asset_sha source_receipt_sha tracer_sha battery_sha compiler cmake_version runner
          python3 - <<'PY'
          import json, os, pathlib
          receipt = {
              "schema_version": 1,
              "version": os.environ["RELEASE_TAG"][1:],
              "tag_name": os.environ["RELEASE_TAG"],
              "source_sha": os.environ["SOURCE_SHA"],
              "release_id": os.environ["RELEASE_ID"],
              "source_receipt_sha256": os.environ["source_receipt_sha"],
              "asset_name": "gabbaboy-core-linux-x64.tar.gz",
              "asset_sha256": os.environ["asset_sha"],
              "build": {
                  "compiler": os.environ["compiler"],
                  "cmake": os.environ["cmake_version"],
                  "runner": os.environ["runner"],
                  "configuration": "Release",
                  "fixture_manifest_sha256": os.environ["tracer_sha"],
                  "corpus_manifest_sha256": os.environ["battery_sha"],
              },
              "fixtures": {
                  "tracer_manifest_sha256": os.environ["tracer_sha"],
                  "battery_manifest_sha256": os.environ["battery_sha"],
              },
          }
          pathlib.Path("build/build-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - name: Append only byte-identical archive to the existing draft
        if: env.CANDIDATE_REUSED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          build_receipt_count=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" --jq '[.[] | select(.name == "build-receipt.json")] | length')
          [[ "$build_receipt_count" -le 1 ]] || { echo "Draft has duplicate build receipts." >&2; exit 1; }
          if [[ "$build_receipt_count" == 1 ]]; then
            mkdir -p build/existing
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern build-receipt.json --dir build/existing
            cmp -s build/build-receipt.json build/existing/build-receipt.json || { echo "Existing build receipt differs." >&2; exit 1; }
          else
            gh release upload "$RELEASE_TAG" build/build-receipt.json --repo "$GH_REPO"
          fi
          assets=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100")
          count=$(jq '[.[] | select(.name == "gabbaboy-core-linux-x64.tar.gz")] | length' <<<"$assets")
          [[ "$count" -le 1 ]] || { echo "Draft has duplicate core archive assets." >&2; exit 1; }
          if [[ "$count" == 1 ]]; then
            mkdir -p build/existing
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern gabbaboy-core-linux-x64.tar.gz --dir build/existing
            cmp -s build/gabbaboy-core-linux-x64.tar.gz build/existing/gabbaboy-core-linux-x64.tar.gz || {
              echo "Existing draft archive differs from the rebuilt bytes; refusing replacement." >&2
              exit 1
            }
          else
            gh release upload "$RELEASE_TAG" build/gabbaboy-core-linux-x64.tar.gz --repo "$GH_REPO"
          fi
          license_count=$(jq '[.[] | select(.name == "gabbaboy-notices.txt")] | length' <<<"$assets")
          [[ "$license_count" -le 1 ]] || { echo "Draft has duplicate notice assets." >&2; exit 1; }
          if [[ "$license_count" == 1 ]]; then
            mkdir -p build/existing
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern gabbaboy-notices.txt --dir build/existing
            cmp -s LICENSE build/existing/gabbaboy-notices.txt || { echo "Existing notice bytes differ." >&2; exit 1; }
          else
            cp LICENSE build/gabbaboy-notices.txt
            gh release upload "$RELEASE_TAG" build/gabbaboy-notices.txt --repo "$GH_REPO"
          fi
      - name: Download the exact draft bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/downloaded build/consumer-work
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
            --pattern gabbaboy-core-linux-x64.tar.gz --pattern gabbaboy-notices.txt \
            --pattern source-receipt.json --pattern build-receipt.json --dir build/downloaded
      - name: Smoke relocated C/C++ consumers from the downloaded bytes
        shell: bash
        run: |
          set -euo pipefail
          [[ $(sha256sum build/downloaded/gabbaboy-notices.txt | cut -d ' ' -f1) == $(sha256sum LICENSE | cut -d ' ' -f1) ]] || {
            echo "Downloaded notice bytes differ from the tagged source notice." >&2
            exit 1
          }
          bash tests/scripts/verify-release-candidate.sh --extract \
            build/downloaded/gabbaboy-core-linux-x64.tar.gz build/extracted
          prefix="$PWD/build/extracted"
          cmake -DGBB_INSTALL_PREFIX="$prefix" -DGBB_EXECUTABLE_SUFFIX= \
            -DGBB_RUNNER_WORKDIR="$PWD/build/consumer-work/runner" \
            "-DGBB_FORBIDDEN_PATHS=$GITHUB_WORKSPACE;$GITHUB_WORKSPACE/build" \
            -P cmake/VerifyInstalledPackage.cmake
          for language in c cpp; do
            cmake -S "tests/consumers/$language" -B "build/consumer-work/$language" \
              -DCMAKE_PREFIX_PATH="$prefix" \
              -DGBB_TRACER_ROM="$prefix/share/gabbaboy/fixtures/tracer/tracer.gb"
            cmake --build "build/consumer-work/$language" --parallel 2
            "build/consumer-work/$language/consumer-$language" \
              "$prefix/share/gabbaboy/fixtures/tracer/tracer.gb"
          done
      - name: Prove downloaded relocated C and C++ consumer behavior
        env:
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          # The v0.2 verifier rejects a prefix inside the checkout, so extract the downloaded bytes elsewhere.
          bash tests/scripts/verify-release-candidate.sh --extract \
            build/downloaded/gabbaboy-core-linux-x64.tar.gz "$RUNNER_TEMP/v02-extracted"
          # The consumer verifier needs a candidate manifest; bind the downloaded bytes to the source and the
          # attached build receipt the same way the final gate does.
          python3 -I tests/scripts/verify-v02-consumers.py --write-candidate-manifest "$RUNNER_TEMP/candidate-manifest.json" \
            --archive build/downloaded/gabbaboy-core-linux-x64.tar.gz --source-sha "$SOURCE_SHA" \
            --build-receipt build/downloaded/build-receipt.json
          python3 -I tests/scripts/verify-v02-consumers.py --prefix "$RUNNER_TEMP/v02-extracted" \
            --archive build/downloaded/gabbaboy-core-linux-x64.tar.gz --candidate-manifest "$RUNNER_TEMP/candidate-manifest.json" \
            --output build/v02-consumer-receipt.json
      - name: Attach the consumer receipt to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          # The receipt carries a per-run identifier, so a retry keeps the already attached receipt and never replaces it.
          count=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" | jq '[.[] | select(.name == "v02-consumer-receipt.json")] | length')
          [[ "$count" -le 1 ]] || { echo "Draft has duplicate consumer receipts." >&2; exit 1; }
          if [[ "$count" == 0 ]]; then
            gh release upload "$RELEASE_TAG" build/v02-consumer-receipt.json --repo "$GH_REPO"
          fi
      - name: Inspect the GitHub generated source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/source-archive.tar.gz"
          # Bounded streaming download (bytes, total and stall time, redirects) from the workflow revision's helper.
          git show "${GITHUB_SHA}:.github/scripts/download-release-artifact.py" > "$RUNNER_TEMP/download-release-artifact.py"
          python3 -I "$RUNNER_TEMP/download-release-artifact.py" "https://github.com/$GH_REPO/archive/refs/tags/$RELEASE_TAG.tar.gz" "$archive" --max-bytes 1073741824 --total-timeout 600
          python3 -I tests/scripts/verify-v02-source-archive.py --archive "$archive" \
            --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --repo . --output build/source-archive-receipt.json
          python3 -I tests/scripts/verify-v02-source-archive.py --check-receipt build/source-archive-receipt.json \
            --archive "$archive" --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --repo .
      - name: Attach the source archive receipt to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          # The archive receipt is deterministic for the same archive bytes, so an existing asset must be identical.
          count=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" | jq '[.[] | select(.name == "source-archive-receipt.json")] | length')
          [[ "$count" -le 1 ]] || { echo "Draft has duplicate source archive receipts." >&2; exit 1; }
          if [[ "$count" == 1 ]]; then
            existing_dir="build/existing/asset-readback/source-archive-receipt.json"
            mkdir -p "$existing_dir"
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern source-archive-receipt.json --dir "$existing_dir"
            cmp -s build/source-archive-receipt.json "$existing_dir/source-archive-receipt.json" || {
              echo "Existing source archive receipt differs from the recomputed receipt." >&2
              exit 1
            }
          else
            gh release upload "$RELEASE_TAG" build/source-archive-receipt.json --repo "$GH_REPO"
          fi
      - name: Fetch any existing downloaded-byte candidate receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100")
          receipt_count=$(jq '[.[] | select(.name == "candidate-receipt.json")] | length' <<<"$assets")
          [[ "$receipt_count" -le 1 ]] || { echo "Draft has duplicate candidate receipts." >&2; exit 1; }
          if [[ "$receipt_count" == 1 ]]; then
            mkdir -p build/existing
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern candidate-receipt.json --dir build/existing
            echo CANDIDATE_RECEIPT_EXISTS=true >> "$GITHUB_ENV"
          else
            echo CANDIDATE_RECEIPT_EXISTS=false >> "$GITHUB_ENV"
          fi
      - name: Write or revalidate downloaded-byte candidate receipt
        env:
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_NOTES_FILE: ${{ steps.identity.outputs.release_notes_file }}
          PR_HEAD_SHA: ${{ steps.proof.outputs.head_sha }}
          PR_MERGE_SHA: ${{ steps.proof.outputs.merge_commit_sha }}
          PR_NUMBER: ${{ steps.proof.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Derive the digest from bytes downloaded from the existing GitHub draft.
          asset_sha=$(sha256sum build/downloaded/gabbaboy-core-linux-x64.tar.gz | cut -d ' ' -f1)
          notice_sha=$(sha256sum build/downloaded/gabbaboy-notices.txt | cut -d ' ' -f1)
          source_receipt_sha=$(sha256sum build/downloaded/source-receipt.json | cut -d ' ' -f1)
          build_receipt_sha=$(sha256sum build/downloaded/build-receipt.json | cut -d ' ' -f1)
          tracer_sha=$(sha256sum fixtures/tracer/manifest.json | cut -d ' ' -f1)
          battery_sha=$(sha256sum fixtures/mbc1-continuation/manifest.json | cut -d ' ' -f1)
          cmake_version=$(cmake --version | head -n1)
          compiler=$(cc --version | head -n1)
          smoke_runner=$(uname -a)
          build_runner=$(jq -er '.build.runner' build/downloaded/build-receipt.json)
          export asset_sha notice_sha source_receipt_sha build_receipt_sha tracer_sha battery_sha cmake_version compiler smoke_runner build_runner
          if [[ "$CANDIDATE_RECEIPT_EXISTS" == true ]]; then
            bash tests/scripts/verify-release-candidate.sh --verify \
              build/existing/candidate-receipt.json build/downloaded/gabbaboy-core-linux-x64.tar.gz \
              "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA" "$RELEASE_ID" \
              build/downloaded/gabbaboy-notices.txt build/downloaded/source-receipt.json \
              build/downloaded/build-receipt.json
            python3 - build/existing/candidate-receipt.json "$RELEASE_NOTES_FILE" <<'PY'
          import hashlib, json, os, pathlib, sys
          receipt = json.loads(pathlib.Path(sys.argv[1]).read_text())
          proof = receipt.get("prior_pr_proof", {})
          if proof.get("head_sha") != os.environ["PR_HEAD_SHA"] or proof.get("merge_commit_sha") != os.environ["PR_MERGE_SHA"]:
              raise SystemExit("Stored receipt was produced from different exact-head PR evidence.")
          notes_sha = hashlib.sha256(pathlib.Path(sys.argv[2]).read_bytes()).hexdigest()
          notice_sha = hashlib.sha256(pathlib.Path("build/downloaded/gabbaboy-notices.txt").read_bytes()).hexdigest()
          if receipt.get("release_notes_sha256") != notes_sha or receipt.get("notice_sha256") != notice_sha:
              raise SystemExit("Stored receipt does not match the current release notes and notice bytes.")
          PY
            "$RUNNER_TEMP/verify-release-gates.sh" --check-runner-evidence \
              build/existing/candidate-receipt.json build/downloaded/build-receipt.json \
              "$RELEASE_TAG" "$SOURCE_SHA" "$smoke_runner"
          else
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          notes = pathlib.Path(os.environ["RELEASE_NOTES_FILE"]).read_text()
          receipt = {
              "schema_version": 1,
              "version": os.environ["RELEASE_VERSION"],
              "tag_name": os.environ["RELEASE_TAG"],
              "source_sha": os.environ["SOURCE_SHA"],
              "release_id": os.environ["RELEASE_ID"],
              "draft": True,
              "source_clean": True,
              "smoke_result": "passed",
              "notice_file": "gabbaboy-notices.txt",
              "notice_sha256": os.environ["notice_sha"],
              "release_notes": notes,
              "release_notes_sha256": hashlib.sha256(notes.encode()).hexdigest(),
              "source_receipt_sha256": os.environ["source_receipt_sha"],
              "build_receipt_sha256": os.environ["build_receipt_sha"],
              "build": {
                  "compiler": os.environ["compiler"],
                  "cmake": os.environ["cmake_version"],
                  "runner": os.environ["build_runner"],
                  "configuration": "Release",
                  "fixture_manifest_sha256": os.environ["tracer_sha"],
                  "corpus_manifest_sha256": os.environ["battery_sha"],
              },
              "smoke": {"runner": os.environ["smoke_runner"]},
              "fixtures": {
                  "tracer_manifest_sha256": os.environ["tracer_sha"],
                  "battery_manifest_sha256": os.environ["battery_sha"],
              },
              "assets": [{"name": "gabbaboy-core-linux-x64.tar.gz", "sha256": os.environ["asset_sha"]}],
              "prior_pr_proof": {
                  "head_sha": os.environ["PR_HEAD_SHA"],
                  "merge_commit_sha": os.environ["PR_MERGE_SHA"],
                  "pr_number": int(os.environ["PR_NUMBER"]),
                  "required_checks": "passed",
              },
          }
          pathlib.Path("build/downloaded/candidate-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
          bash tests/scripts/verify-release-candidate.sh --verify \
            build/downloaded/candidate-receipt.json build/downloaded/gabbaboy-core-linux-x64.tar.gz \
            "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA" "$RELEASE_ID" \
            build/downloaded/gabbaboy-notices.txt build/downloaded/source-receipt.json \
            build/downloaded/build-receipt.json
          "$RUNNER_TEMP/verify-release-gates.sh" --check-runner-evidence \
            build/downloaded/candidate-receipt.json build/downloaded/build-receipt.json \
            "$RELEASE_TAG" "$SOURCE_SHA" "$smoke_runner"
          fi
      - name: Attach the downloaded-byte candidate receipt to the draft
        if: env.CANDIDATE_RECEIPT_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          current_release=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")
          [[ $(jq -r '.draft' <<<"$current_release") == true && \
             $(jq -r '.tag_name' <<<"$current_release") == "$RELEASE_TAG" ]] || {
            echo "Draft status or tag changed during candidate qualification." >&2
            exit 1
          }
          [[ $(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha') == "$SOURCE_SHA" ]] || {
            echo "Tag target changed during candidate qualification." >&2
            exit 1
          }
          gh release upload "$RELEASE_TAG" build/downloaded/candidate-receipt.json --repo "$GH_REPO"
      - name: Report the qualified candidate
        shell: bash
        run: echo "Candidate is qualified and remains a draft. Only the final 06-06 gate may publish it."
      - name: Download the attached candidate, product package and source archive receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/final-verify
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
            --pattern candidate-receipt.json --pattern gabbaboy-core-linux-x64.tar.gz \
            --pattern gabbaboy-notices.txt --pattern source-receipt.json \
            --pattern build-receipt.json --pattern source-archive-receipt.json --dir build/final-verify
      - name: Verify the attached candidate, product package and source archive receipt together
        env:
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          bash tests/scripts/verify-release-candidate.sh --verify-final \
            build/final-verify/candidate-receipt.json build/final-verify/gabbaboy-core-linux-x64.tar.gz \
            "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA" "$RELEASE_ID" \
            build/final-verify/gabbaboy-notices.txt build/final-verify/source-receipt.json \
            build/final-verify/build-receipt.json "$RUNNER_TEMP/source-archive.tar.gz" \
            build/final-verify/source-archive-receipt.json

  candidate-macos:
    name: downloaded-macos-arm64-candidates
    needs: [release, candidate]
    if: ${{ always() && needs.candidate.result == 'success' && ((inputs.retry == true) || (needs.release.result == 'success' && needs.release.outputs.release_created == 'true')) }}
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.retry && inputs.tag_name || needs.release.outputs.tag_name }}
      SOURCE_SHA: ${{ inputs.retry && inputs.source_sha || needs.release.outputs.sha }}
      RELEASE_ID: ${{ inputs.retry && inputs.release_id || '' }}
      GBB_EXPECTED_SOURCE_REVISION: ${{ inputs.retry && inputs.source_sha || needs.release.outputs.sha }}
      SOURCE_REVISION: ${{ inputs.retry && inputs.source_sha || needs.release.outputs.sha }}
    steps:
      - name: Require trusted candidate identity and unpublished matching draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GH_REPO" == szTheory/gabbaboy && "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" == "$SOURCE_SHA" ]] || exit 1
          release_json=$(gh api "repos/$GH_REPO/releases?per_page=100")
          [[ $(jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag and .draft == true)] | length' <<<"$release_json") == 1 ]] || {
            echo "Expected exactly one unpublished draft for $RELEASE_TAG." >&2; exit 1;
          }
          actual_id=$(jq --arg tag "$RELEASE_TAG" -r '.[] | select(.tag_name == $tag) | .id' <<<"$release_json")
          if [[ -n "$RELEASE_ID" ]]; then [[ "$actual_id" == "$RELEASE_ID" ]] || exit 1; fi
          echo "RELEASE_ID=$actual_id" >> "$GITHUB_ENV"
      - name: Check out exact trusted tag source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked out source version
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          source_version=$(sed -nE 's/^project\(GabbaBoy VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n1)
          [[ "$source_version" == "$version" ]] || { echo "Tag and checked out CMake version differ." >&2; exit 1; }
      - name: Load trusted deterministic archive helper
        shell: bash
        run: |
          set -euo pipefail
          git show "${GITHUB_SHA}:.github/scripts/create-deterministic-archive.py" > "$RUNNER_TEMP/create-deterministic-archive.py"
          python3 "$RUNNER_TEMP/create-deterministic-archive.py" --self-test
      - name: Overlay the trusted release-candidate verifiers from the workflow commit
        shell: bash
        run: |
          set -euo pipefail
          # The tagged tree is data here: run the workflow commit's copies of the verifiers that judge the downloaded bytes.
          # verify-release-candidate.sh --extract reaches verify-v02-consumers.py, so both are replaced before either runs.
          git show "${GITHUB_SHA}:tests/scripts/verify-release-candidate.sh" > tests/scripts/verify-release-candidate.sh
          git show "${GITHUB_SHA}:tests/scripts/verify-v02-consumers.py" > tests/scripts/verify-v02-consumers.py
      - name: Select a complete existing macOS candidate or a clean build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100")
          names=(gabbaboy-core-macos-arm64.tar.gz gabbaboy-core-macos-arm64.tar.gz.sha256 gabbaboy-build-receipt-macos-arm64.json gabbaboy-preview-macos-arm64.tar.gz gabbaboy-preview-macos-arm64-build-receipt.json)
          present=0
          for name in "${names[@]}"; do
            count=$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' <<<"$assets")
            [[ "$count" -le 1 ]] || { echo "Duplicate draft attachment: $name" >&2; exit 1; }
            (( count == 1 )) && present=$((present + 1))
          done
          if (( present == 0 )); then
            echo REUSE_MACOS_CANDIDATE=false >> "$GITHUB_ENV"
          elif (( present == ${#names[@]} )); then
            mkdir -p build/reuse
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
              --pattern gabbaboy-core-macos-arm64.tar.gz \
              --pattern gabbaboy-core-macos-arm64.tar.gz.sha256 \
              --pattern gabbaboy-build-receipt-macos-arm64.json \
              --pattern gabbaboy-preview-macos-arm64.tar.gz \
              --pattern gabbaboy-preview-macos-arm64-build-receipt.json --dir build/reuse
            cp build/reuse/gabbaboy-core-macos-arm64.tar.gz build/
            cp build/reuse/gabbaboy-core-macos-arm64.tar.gz.sha256 build/
            cp build/reuse/gabbaboy-build-receipt-macos-arm64.json build/
            cp build/reuse/gabbaboy-preview-macos-arm64.tar.gz build/
            cp build/reuse/gabbaboy-preview-macos-arm64-build-receipt.json build/
            echo REUSE_MACOS_CANDIDATE=true >> "$GITHUB_ENV"
          else
            echo "Draft contains a partial macOS candidate asset set; refusing to rebuild or replace bytes." >&2
            exit 1
          fi
      - name: Build and package macOS arm64 core once
        if: env.REUSE_MACOS_CANDIDATE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/release-core -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DGABBABOY_BUILD_PLAYER=OFF
          cmake --build build/release-core --parallel 2
          cmake --install build/release-core --prefix build/release-stage
          mkdir -p build/release-stage/share/gabbaboy
          cp LICENSE build/release-stage/share/gabbaboy/LICENSE.txt
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$SOURCE_SHA")
          export SOURCE_DATE_EPOCH
          python3 "$RUNNER_TEMP/create-deterministic-archive.py" \
            build/release-stage build/gabbaboy-core-macos-arm64.tar.gz
          shasum -a 256 build/gabbaboy-core-macos-arm64.tar.gz | awk '{print $1}' > build/gabbaboy-core-macos-arm64.tar.gz.sha256
          python3 - <<'PY'
          import json, os, pathlib, platform, subprocess
          cc = subprocess.run(["cc", "--version"], check=True, text=True, capture_output=True).stdout.splitlines()[0]
          cmake = subprocess.run(["cmake", "--version"], check=True, text=True, capture_output=True).stdout.splitlines()[0]
          pathlib.Path("build/gabbaboy-build-receipt-macos-arm64.json").write_text(json.dumps({
              "schema_version": 1, "platform": "macos-arm64", "runner": "macos-14",
              "os": platform.platform(), "architecture": platform.machine(), "compiler": cc,
              "cmake": cmake, "configuration": "Release", "source_sha": os.environ["SOURCE_SHA"]
          }, indent=2) + "\n")
          PY
      - name: Build pinned SDL player and verify extracted package
        if: env.REUSE_MACOS_CANDIDATE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash tests/scripts/verify-phase3-player.sh --build-package
          cp build/phase3-player/preview-candidate/gabbaboy-preview-macos-arm64.tar.gz build/
          cp build/phase3-player/preview-candidate/build-receipt.json build/gabbaboy-preview-macos-arm64-build-receipt.json
      - name: Attach macOS candidate bytes to the unpublished draft
        if: env.REUSE_MACOS_CANDIDATE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")
          [[ $(jq -r .draft <<<"$current") == true && $(jq -r .tag_name <<<"$current") == "$RELEASE_TAG" ]] || exit 1
          for file in build/gabbaboy-core-macos-arm64.tar.gz build/gabbaboy-core-macos-arm64.tar.gz.sha256 build/gabbaboy-build-receipt-macos-arm64.json build/gabbaboy-preview-macos-arm64.tar.gz build/gabbaboy-preview-macos-arm64-build-receipt.json; do
            name=$(basename "$file")
            count=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" | jq --arg name "$name" '[.[] | select(.name == $name)] | length')
            [[ "$count" -le 1 ]] || { echo "Duplicate draft attachment: $name" >&2; exit 1; }
            if [[ "$count" == 1 ]]; then
              mkdir -p build/existing
              gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern "$name" --dir build/existing
              cmp -s "$file" "build/existing/$name" || { echo "Retry asset differs: $name" >&2; exit 1; }
            else
              gh release upload "$RELEASE_TAG" "$file" --repo "$GH_REPO"
            fi
          done
      - name: Download the attached player archive and core archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")
          [[ $(jq -r .draft <<<"$current") == true && $(jq -r .tag_name <<<"$current") == "$RELEASE_TAG" ]] || exit 1
          mkdir -p build/downloaded-player
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern gabbaboy-preview-macos-arm64.tar.gz --pattern gabbaboy-preview-macos-arm64-build-receipt.json --dir build/downloaded-player
          cp build/downloaded-player/gabbaboy-preview-macos-arm64-build-receipt.json build/downloaded-player/build-receipt.json
          mkdir -p build/downloaded-core build/consumer-work
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern gabbaboy-core-macos-arm64.tar.gz --pattern gabbaboy-core-macos-arm64.tar.gz.sha256 --dir build/downloaded-core
      - name: Smoke the downloaded player archive and relocated C/C++ consumers
        shell: bash
        run: |
          set -euo pipefail
          GBB_VERIFIED_OUTPUT_DIR="$RUNNER_TEMP/release-player-downloaded" bash tests/scripts/verify-phase3-player.sh --verify-package build/downloaded-player
          git show "${GITHUB_SHA}:.github/scripts/verify-release-gates.sh" > "$RUNNER_TEMP/verify-release-gates.sh"
          bash "$RUNNER_TEMP/verify-release-gates.sh" --check-digest-sidecar \
            build/downloaded-core/gabbaboy-core-macos-arm64.tar.gz.sha256 \
            build/downloaded-core/gabbaboy-core-macos-arm64.tar.gz
          bash tests/scripts/verify-release-candidate.sh --extract build/downloaded-core/gabbaboy-core-macos-arm64.tar.gz build/extracted-core
          prefix="$PWD/build/extracted-core"
          cmake -DGBB_INSTALL_PREFIX="$prefix" -DGBB_EXECUTABLE_SUFFIX= -DGBB_RUNNER_WORKDIR="$PWD/build/consumer-work/runner" "-DGBB_FORBIDDEN_PATHS=$GITHUB_WORKSPACE;$GITHUB_WORKSPACE/build" -P cmake/VerifyInstalledPackage.cmake
          for language in c cpp; do
            cmake -S "tests/consumers/$language" -B "build/consumer-work/$language" -DCMAKE_PREFIX_PATH="$prefix" -DGBB_TRACER_ROM="$prefix/share/gabbaboy/fixtures/tracer/tracer.gb"
            cmake --build "build/consumer-work/$language" --parallel 2
            "build/consumer-work/$language/consumer-$language" "$prefix/share/gabbaboy/fixtures/tracer/tracer.gb"
          done

