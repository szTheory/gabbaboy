          pr_merge_sha=$(jq -r '.prior_pr_proof.merge_commit_sha' build/release-proof/source-receipt.json)
          [[ "$pr_head_sha" =~ ^[0-9a-f]{40}$ && "$pr_merge_sha" == "$SOURCE_SHA" ]] || {
            echo "Source receipt does not bind an exact PR head to this release merge commit." >&2; exit 1;
          }
          mkdir -p build
          python3 tests/scripts/verify-support-ledger.py --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --output build/support-ledger-v0.1.0.json
          gh api "repos/$GH_REPO/commits/$pr_head_sha/check-runs?per_page=100" > build/all-head-check-runs.json
          jq --arg expected_head "$pr_head_sha" \
            '[.check_runs[] | select(.head_sha == $expected_head and .status == "completed" and .conclusion == "success") | {id, name, started_at, completed_at, conclusion, head_sha}]' \
            build/all-head-check-runs.json > build/hosted-check-runs.json
          assets=$(gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100")
          for name in support-ledger-v0.1.0.json release-performance-receipt.json; do
            # shellcheck disable=SC2016
            count=$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' <<<"$assets")
            [[ "$count" -le 1 ]] || { echo "Duplicate release evidence asset: $name" >&2; exit 1; }
          done
          if [[ $(jq '[.[] | select(.name == "release-performance-receipt.json")] | length' <<<"$assets") == 1 ]]; then
            existing_performance_dir="build/existing/release-performance-receipt.json"
            mkdir -p "$existing_performance_dir"
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern release-performance-receipt.json --dir "$existing_performance_dir"
            RELEASE_CHECK_HEAD_SHA="$pr_head_sha" python3 - "$SOURCE_SHA" "$RELEASE_TAG" "$existing_performance_dir/release-performance-receipt.json" <<'PY'
          import json, pathlib, sys
          import os
          source, tag, path = sys.argv[1:]
          data = json.loads(pathlib.Path(path).read_text())
          if data.get("source_sha") != source or data.get("release_tag") != tag or data.get("trace_pair_digest_equal") is not True or data.get("hosted_check_head_sha") != os.environ["RELEASE_CHECK_HEAD_SHA"]:
              raise SystemExit("Existing performance receipt is stale or invalid")
          PY
            cp "$existing_performance_dir/release-performance-receipt.json" build/
          else
            SOURCE_SHA="$SOURCE_SHA" RELEASE_TAG="$RELEASE_TAG" EXPECTED_CHECK_HEAD_SHA="$pr_head_sha" HOSTED_CHECKS_JSON=build/hosted-check-runs.json \
              bash tests/scripts/measure-release-baseline.sh --self-test
            test -s build/release-measure/release-performance-receipt.json
            cp build/release-measure/release-performance-receipt.json build/
            cmp -s build/release-measure/release-performance-receipt.json build/release-performance-receipt.json
          fi
          python3 tests/scripts/verify-support-ledger.py --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" \
            --verify-sidecar build/support-ledger-v0.1.0.json
          RELEASE_CHECK_HEAD_SHA="$pr_head_sha" python3 - "$SOURCE_SHA" "$RELEASE_TAG" build/release-performance-receipt.json <<'PY'
          import json, pathlib, sys
          import os
          source, tag, path = sys.argv[1:]
          data = json.loads(pathlib.Path(path).read_text())
          if data.get("source_sha") != source or data.get("release_tag") != tag or data.get("trace_pair_digest_equal") is not True or data.get("hosted_check_head_sha") != os.environ["RELEASE_CHECK_HEAD_SHA"] or not data.get("hosted_exact_source_check_durations"):
              raise SystemExit("Performance receipt is missing exact source, tag, paired digest, or hosted CI duration evidence")
          PY
          for name in support-ledger-v0.1.0.json release-performance-receipt.json; do
            # shellcheck disable=SC2016
            count=$(gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100" | jq --arg name "$name" '[.[] | select(.name == $name)] | length')
            if [[ "$count" == 1 ]]; then
              existing_dir="build/existing/$name"
              mkdir -p "$existing_dir"
              gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern "$name" --dir "$existing_dir"
              cmp -s "build/$name" "$existing_dir/$name" || { echo "Existing release evidence differs: $name" >&2; exit 1; }
            else
              gh release upload "$RELEASE_TAG" "build/$name" --repo "$GH_REPO"
            fi
          done
      - name: Validate the exact candidate asset set after platform smoke
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GH_REPO" == szTheory/gabbaboy && "$GITHUB_REF" == refs/heads/main ]] || exit 1
          release_json=$(gh api "repos/$GH_REPO/releases?per_page=100")
          [[ $(jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag and .draft == true)] | length' <<<"$release_json") == 1 ]] || exit 1
          release_id=$(jq --arg tag "$RELEASE_TAG" -r '.[] | select(.tag_name == $tag) | .id' <<<"$release_json")
          if [[ -n "$RELEASE_ID" ]]; then [[ "$release_id" == "$RELEASE_ID" ]] || exit 1; fi
          [[ $(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha) == "$SOURCE_SHA" ]] || exit 1
          assets=$(gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100")
          python3 - "$assets" <<'PY'
          import json, sys
          rows = json.loads(sys.argv[1])
          names = [row["name"] for row in rows]
          expected = {
              "candidate-receipt.json", "gabbaboy-core-linux-x64.tar.gz", "gabbaboy-notices.txt",
              "source-receipt.json", "build-receipt.json", "gabbaboy-core-macos-arm64.tar.gz",
              "gabbaboy-core-macos-arm64.tar.gz.sha256", "gabbaboy-build-receipt-macos-arm64.json",
              "gabbaboy-preview-macos-arm64.tar.gz", "gabbaboy-preview-macos-arm64-build-receipt.json",
              "gabbaboy-core-windows-x64.tar.gz", "gabbaboy-core-windows-x64.tar.gz.sha256",
              "gabbaboy-build-receipt-windows-x64.json", "support-ledger-v0.1.0.json",
              "release-performance-receipt.json",
          }
          if len(names) != len(set(names)):
              raise SystemExit("release draft contains duplicate asset names")
          actual = set(names)
          if actual not in (expected, expected | {"candidate-platform-manifest.json"}):
              raise SystemExit(f"candidate asset set mismatch; missing={sorted(expected-actual)} unknown={sorted(actual-expected)}")
          PY
          mkdir -p build/downloaded
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern 'gabbaboy-core-*' --pattern 'gabbaboy-preview-*' --pattern 'gabbaboy-build-receipt-*' --pattern candidate-receipt.json --pattern gabbaboy-notices.txt --pattern source-receipt.json --pattern build-receipt.json --pattern support-ledger-v0.1.0.json --pattern release-performance-receipt.json --dir build/downloaded
          git show "${GITHUB_SHA}:.github/scripts/verify-release-gates.sh" > build/verify-release-gates.sh
          bash build/verify-release-gates.sh --check-digest-sidecar \
            build/downloaded/gabbaboy-core-macos-arm64.tar.gz.sha256 \
            build/downloaded/gabbaboy-core-macos-arm64.tar.gz
          bash build/verify-release-gates.sh --check-digest-sidecar \
            build/downloaded/gabbaboy-core-windows-x64.tar.gz.sha256 \
            build/downloaded/gabbaboy-core-windows-x64.tar.gz
          python3 - "$SOURCE_SHA" <<'PY'
          import hashlib, json, pathlib, sys
          source_sha = sys.argv[1]
          root = pathlib.Path("build/downloaded")
          assets = []
          for path in sorted(root.iterdir()):
              if not path.is_file(): raise SystemExit(f"unexpected non-file release asset: {path.name}")
              assets.append({"name": path.name, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          required = {"candidate-receipt.json", "gabbaboy-core-linux-x64.tar.gz", "gabbaboy-notices.txt",
                      "source-receipt.json", "build-receipt.json", "gabbaboy-core-macos-arm64.tar.gz",
                      "gabbaboy-core-macos-arm64.tar.gz.sha256", "gabbaboy-build-receipt-macos-arm64.json",
                      "gabbaboy-preview-macos-arm64.tar.gz", "gabbaboy-preview-macos-arm64-build-receipt.json",
                      "gabbaboy-core-windows-x64.tar.gz", "gabbaboy-core-windows-x64.tar.gz.sha256",
                      "gabbaboy-build-receipt-windows-x64.json", "support-ledger-v0.1.0.json",
                      "release-performance-receipt.json"}
          if {item["name"] for item in assets} != required:
              raise SystemExit("downloaded release asset set differs from the qualified exact set")
          for evidence_name in ("support-ledger-v0.1.0.json", "release-performance-receipt.json"):
              if not any(item["name"] == evidence_name for item in assets):
                  raise SystemExit(f"generated source evidence missing from manifest: {evidence_name}")
          evidence = {}
          for platform in ("macos-arm64", "windows-x64"):
              receipt = json.loads((root / f"gabbaboy-build-receipt-{platform}.json").read_text())
              if receipt.get("source_sha") != source_sha or receipt.get("platform") != platform:
                  raise SystemExit(f"build receipt identity mismatch for {platform}")
              evidence[platform] = receipt
          linux = json.loads((root / "build-receipt.json").read_text())
          if linux.get("source_sha") != source_sha or linux.get("asset_name") != "gabbaboy-core-linux-x64.tar.gz":
              raise SystemExit("Linux build receipt identity mismatch")
          evidence["linux-x64"] = linux.get("build")
          preview = json.loads((root / "gabbaboy-preview-macos-arm64-build-receipt.json").read_text())
          if preview.get("source_revision") != source_sha or preview.get("result") != "passed":
              raise SystemExit("player build receipt identity or result mismatch")
          data = {"schema_version": 1, "source_sha": source_sha, "assets": assets, "builds": evidence,
                  "support_sidecar": "support-ledger-v0.1.0.json",
                  "performance_receipt": "release-performance-receipt.json",
                  "player_build_receipt": "gabbaboy-preview-macos-arm64-build-receipt.json",
                  "downloaded_smoke": "Linux/macOS/Windows core consumers and macOS player passed",
                  "hardware_qualified": False, "signed": False, "notarized": False}
          pathlib.Path("build/candidate-platform-manifest.json").write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY
          current=$(gh api "repos/$GH_REPO/releases/$release_id")
          [[ $(jq -r .draft <<<"$current") == true && $(jq -r .tag_name <<<"$current") == "$RELEASE_TAG" ]] || exit 1
          count=$(gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100" --jq '[.[] | select(.name == "candidate-platform-manifest.json")] | length')
          [[ "$count" -le 1 ]] || exit 1
          if [[ "$count" == 1 ]]; then
            mkdir -p build/existing
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern candidate-platform-manifest.json --dir build/existing
            cmp -s build/candidate-platform-manifest.json build/existing/candidate-platform-manifest.json || exit 1
          else
            gh release upload "$RELEASE_TAG" build/candidate-platform-manifest.json --repo "$GH_REPO"
          fi

  publish-qualified-release:
    name: final-downloaded-byte-gate-and-publish
    needs: [release, candidate, candidate-macos, candidate-windows, candidate-platform-manifest]
    if: ${{ always() && needs.candidate.result == 'success' && needs.candidate-macos.result == 'success' && needs.candidate-windows.result == 'success' && needs.candidate-platform-manifest.result == 'success' && ((inputs.retry == true) || (needs.release.result == 'success' && needs.release.outputs.release_created == 'true')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      checks: read
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.retry && inputs.tag_name || needs.release.outputs.tag_name }}
      SOURCE_SHA: ${{ inputs.retry && inputs.source_sha || needs.release.outputs.sha }}
      INPUT_RELEASE_ID: ${{ inputs.retry && inputs.release_id || '' }}
    steps:
      - name: Require trusted source and all candidate jobs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GH_REPO" == szTheory/gabbaboy && "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" == "$SOURCE_SHA" ]] || {
            echo "Release tag does not resolve to release-please's exact source SHA." >&2; exit 1;
          }
          version=${RELEASE_TAG#v}
          source_version=$(gh api "repos/$GH_REPO/contents/CMakeLists.txt?ref=$SOURCE_SHA" --jq .content | base64 --decode | sed -nE 's/^project\(GabbaBoy VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n1)
          [[ "$source_version" == "$version" ]] || { echo "Release tag and exact tagged CMake version differ." >&2; exit 1; }
          release_json=$(gh api "repos/$GH_REPO/releases?per_page=100")
          [[ $(jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | length' <<<"$release_json") == 1 ]] || {
            echo "Expected exactly one GitHub Release for the tag." >&2; exit 1;
          }
          release_id=$(jq --arg tag "$RELEASE_TAG" -r '.[] | select(.tag_name == $tag) | .id' <<<"$release_json")
          [[ $(jq --arg tag "$RELEASE_TAG" -r '.[] | select(.tag_name == $tag) | .draft' <<<"$release_json") == true ]] || {
            echo "The existing release is not an unpublished draft." >&2; exit 1;
          }
          [[ -z "$INPUT_RELEASE_ID" || "$INPUT_RELEASE_ID" == "$release_id" ]] || {
            echo "Retry release ID differs from the existing draft." >&2; exit 1;
          }
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
      - name: Check out exact tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Revalidate merged PR and exact-head required contexts
        run: bash .github/scripts/verify-release-gates.sh --check-merged-source "$SOURCE_SHA"
      - name: Validate draft candidate and all downloaded platform bytes
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/verify-release-gates.sh --check-draft "$RELEASE_ID" "$RELEASE_TAG" "$SOURCE_SHA"
          mkdir -p build/release-final
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir build/release-final
          api_assets=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100")
          printf '%s\n' "$api_assets" > build/release-final/api-assets.json
          # shellcheck disable=SC2016
          python3 - "$api_assets" build/release-final "$RELEASE_TAG" "$SOURCE_SHA" "$RELEASE_ID" <<'PY'
          import hashlib, json, pathlib, sys
          rows = json.loads(sys.argv[1])
          root = pathlib.Path(sys.argv[2])
          tag, source, release_id = sys.argv[3:]
          names = [row["name"] for row in rows]
          if len(names) != len(set(names)):
              raise SystemExit("duplicate draft asset names")
          files = sorted(p for p in root.iterdir() if p.is_file() and p.name != "api-assets.json")
          if {p.name for p in files} != set(names):
              raise SystemExit("downloaded files do not exactly match GitHub's draft asset inventory")
          sums = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files)
          (root / "SHA256SUMS").write_text(sums)
          manifest = json.loads((root / "candidate-platform-manifest.json").read_text())
          proof = json.loads((root / "candidate-receipt.json").read_text()).get("prior_pr_proof", {})
          release = {
              "schema_version": 1,
              "version": tag[1:],
              "tag": tag,
              "source_sha": source,
              "release_id": release_id,
              "draft": True,
              "signed": False,
              "notarized": False,
              "hardware_qualified": False,
              "sha256sums_sha256": hashlib.sha256((root / "SHA256SUMS").read_bytes()).hexdigest(),
              "prior_pr_proof": proof,
              "downloaded_smoke": "Linux, macOS, and Windows core consumers plus macOS player passed on exact draft bytes",
              "assets": [{"name": row["name"], "id": row["id"], "sha256": hashlib.sha256((root / row["name"]).read_bytes()).hexdigest()}
                         for row in rows],
              "support_sidecar": "support-ledger-v0.1.0.json",
              "support_sidecar_sha256": hashlib.sha256((root / "support-ledger-v0.1.0.json").read_bytes()).hexdigest(),
              "candidate_manifest_sha256": hashlib.sha256((root / "candidate-platform-manifest.json").read_bytes()).hexdigest(),
              "builds": manifest.get("builds", {}),
              "limits": ["DMG-CPU-B deterministic software profile only", "no physical DMG observation", "no Developer ID signature or notarization"],
          }
          (root / "release-receipt.json").write_text(json.dumps(release, indent=2, sort_keys=True) + "\n")
          PY
          for name in SHA256SUMS release-receipt.json; do
            # shellcheck disable=SC2016
            count=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" | jq --arg name "$name" '[.[] | select(.name == $name)] | length')
            [[ "$count" -le 1 ]] || { echo "Duplicate final release metadata: $name" >&2; exit 1; }
            if [[ "$count" == 1 ]]; then
              mkdir -p build/release-final/existing
              gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern "$name" --dir build/release-final/existing
              cmp -s "build/release-final/$name" "build/release-final/existing/$name" || {
                echo "Existing final release metadata differs; refusing replacement." >&2; exit 1;
              }
            else
              gh release upload "$RELEASE_TAG" "build/release-final/$name" --repo "$GH_REPO"
            fi
          done
      - name: Recheck final API inventory and downloaded receipts
        run: bash .github/scripts/verify-release-gates.sh --check-draft-final "$RELEASE_ID" "$RELEASE_TAG" "$SOURCE_SHA"
      - name: Publish the one qualified draft
        shell: bash
        run: |
          set -euo pipefail
          before=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")
          [[ $(jq -r .draft <<<"$before") == true && $(jq -r .tag_name <<<"$before") == "$RELEASE_TAG" ]] || {
            echo "Draft changed before the one-way publish transition." >&2; exit 1;
          }
          [[ "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" == "$SOURCE_SHA" ]] || exit 1
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --verify-tag
          after=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")
          [[ $(jq -r .draft <<<"$after") == false && $(jq -r .tag_name <<<"$after") == "$RELEASE_TAG" ]] || {
            echo "Published release readback did not preserve tag/draft transition." >&2; exit 1;
          }
          assets=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100")
          python3 - "$assets" build/release-final/api-assets.json <<'PY'
          import json, pathlib, sys
          after, before = map(lambda value: json.loads(pathlib.Path(value).read_text()) if pathlib.Path(value).is_file() else json.loads(value), sys.argv[1:])
          def inventory(rows): return sorted((r["id"], r["name"], r.get("digest")) for r in rows)
          old = json.loads(pathlib.Path(sys.argv[2]).read_text())
          if not set(inventory(old)).issubset(set(inventory(after))):
              raise SystemExit("published release readback changed or removed a previously qualified asset")
          if {r["name"] for r in after} != {r["name"] for r in old} | {"SHA256SUMS", "release-receipt.json"}:
              raise SystemExit("published release readback has an unexpected asset inventory")
          PY
          echo "Published the exact qualified release $RELEASE_TAG ($SOURCE_SHA) with unsigned status recorded."
