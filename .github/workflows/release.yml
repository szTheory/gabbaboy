          elif (( present == ${#names[@]} )); then
            mkdir -p build/reuse
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
              --pattern gabbaboy-core-windows-x64.tar.gz \
              --pattern gabbaboy-core-windows-x64.tar.gz.sha256 \
              --pattern gabbaboy-build-receipt-windows-x64.json --dir build/reuse
            cp build/reuse/gabbaboy-core-windows-x64.tar.gz build/
            cp build/reuse/gabbaboy-core-windows-x64.tar.gz.sha256 build/
            cp build/reuse/gabbaboy-build-receipt-windows-x64.json build/
            echo REUSE_WINDOWS_CANDIDATE=true >> "$GITHUB_ENV"
          else
            echo "Draft contains a partial Windows candidate asset set; refusing to rebuild or replace bytes." >&2
            exit 1
          fi
      - name: Build and package Windows x64 core once
        if: env.REUSE_WINDOWS_CANDIDATE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/release-core -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DGABBABOY_BUILD_PLAYER=OFF
          cmake --build build/release-core --config Release --parallel 2
          cmake --install build/release-core --config Release --prefix build/release-stage
          mkdir -p build/release-stage/share/gabbaboy
          cp LICENSE build/release-stage/share/gabbaboy/LICENSE.txt
          tar -czf build/gabbaboy-core-windows-x64.tar.gz -C build/release-stage include lib bin share
          sha256sum build/gabbaboy-core-windows-x64.tar.gz | awk '{print $1}' > build/gabbaboy-core-windows-x64.tar.gz.sha256
          python3 - <<'PY'
          import json, os, pathlib, platform, re, subprocess
          def compiler_identity(metadata):
              def value(name):
                  match = re.search(rf'^set\({name} "([^"]+)"\)', metadata, re.M)
                  return match.group(1) if match else None
              return value("CMAKE_C_COMPILER_ID"), value("CMAKE_C_COMPILER_VERSION")
          sample = 'set(CMAKE_C_COMPILER_ID "MSVC")\nset(CMAKE_C_COMPILER_VERSION "19.44.35229.0")\n'
          if compiler_identity(sample) != ("MSVC", "19.44.35229.0"):
              raise SystemExit("CMake compiler metadata parser self-test failed")
          metadata_files = sorted(pathlib.Path("build/release-core/CMakeFiles").glob("*/CMakeCCompiler.cmake"))
          if not metadata_files:
              raise SystemExit("CMake generated no C compiler-identification metadata")
          identities = {compiler_identity(path.read_text()) for path in metadata_files}
          if len(identities) != 1:
              raise SystemExit("CMake generated conflicting C compiler identities")
          compiler_id, compiler_version = identities.pop()
          if compiler_id != "MSVC" or not compiler_version or not re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,3}", compiler_version):
              raise SystemExit("CMake compiler metadata does not identify a versioned MSVC compiler")
          cmake = subprocess.run(["cmake", "--version"], check=True, text=True, capture_output=True).stdout.splitlines()[0]
          pathlib.Path("build/gabbaboy-build-receipt-windows-x64.json").write_text(json.dumps({
              "schema_version": 1, "platform": "windows-x64", "runner": "windows-2022",
              "os": platform.platform(), "architecture": platform.machine(),
              "compiler": compiler_id + " " + compiler_version + " via Visual Studio 17 2022 x64",
              "c_compiler_id": compiler_id, "c_compiler_version": compiler_version,
              "cmake": cmake, "configuration": "Release", "source_sha": os.environ["SOURCE_SHA"]
          }, indent=2) + "\n")
          PY
      - name: Attach Windows bytes to the unpublished draft
        if: env.REUSE_WINDOWS_CANDIDATE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")
          [[ $(jq -r .draft <<<"$current") == true && $(jq -r .tag_name <<<"$current") == "$RELEASE_TAG" ]] || exit 1
          for file in build/gabbaboy-core-windows-x64.tar.gz build/gabbaboy-core-windows-x64.tar.gz.sha256 build/gabbaboy-build-receipt-windows-x64.json; do
            name=$(basename "$file")
            count=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" | jq --arg name "$name" '[.[] | select(.name == $name)] | length')
            [[ "$count" -le 1 ]] || { echo "Duplicate draft attachment: $name" >&2; exit 1; }
            if [[ "$count" == 1 ]]; then
              mkdir -p build/existing
              gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern "$name" --dir build/existing
              cmp -s "$file" "build/existing/$name" || { echo "Retry asset differs: $name" >&2; exit 1; }
            else
              gh release upload "$RELEASE_TAG" "$file" --repo "$GH_REPO"
            fi
          done
      - name: Download the attached Windows archive and digest sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")
          [[ $(jq -r .draft <<<"$current") == true && $(jq -r .tag_name <<<"$current") == "$RELEASE_TAG" ]] || exit 1
          mkdir -p build/downloaded build/consumer-work
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern gabbaboy-core-windows-x64.tar.gz --pattern gabbaboy-core-windows-x64.tar.gz.sha256 --dir build/downloaded
      - name: Overlay the trusted release-candidate verifiers from the workflow commit
        shell: bash
        run: |
          set -euo pipefail
          # The tagged tree is data here: run the workflow commit's copies of the verifiers that judge the downloaded bytes.
          git show "${GITHUB_SHA}:tests/scripts/verify-release-candidate.sh" > tests/scripts/verify-release-candidate.sh
          git show "${GITHUB_SHA}:tests/scripts/verify-v02-consumers.py" > tests/scripts/verify-v02-consumers.py
      - name: Qualify Windows release archive using the existing native consumer lane
        shell: bash
        run: |
          set -euo pipefail
          git show "${GITHUB_SHA}:.github/scripts/verify-release-gates.sh" > build/verify-release-gates.sh
          bash build/verify-release-gates.sh --check-digest-sidecar \
            build/downloaded/gabbaboy-core-windows-x64.tar.gz.sha256 \
            build/downloaded/gabbaboy-core-windows-x64.tar.gz
          bash tests/scripts/verify-release-candidate.sh --extract build/downloaded/gabbaboy-core-windows-x64.tar.gz build/extracted
          prefix="$PWD/build/extracted"
          cmake -DGBB_INSTALL_PREFIX="$prefix" -DGBB_EXECUTABLE_SUFFIX=.exe -DGBB_CONFIGURATION=Release -DGBB_RUNNER_WORKDIR="$PWD/build/consumer-work/runner" "-DGBB_FORBIDDEN_PATHS=$GITHUB_WORKSPACE;$GITHUB_WORKSPACE/build" -P cmake/VerifyInstalledPackage.cmake
          for language in c cpp; do
            cmake -S "tests/consumers/$language" -B "build/consumer-work/$language" -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$prefix" -DGBB_TRACER_ROM="$prefix/share/gabbaboy/fixtures/tracer/tracer.gb"
            cmake --build "build/consumer-work/$language" --config Release --parallel 2
            "build/consumer-work/$language/Release/consumer-$language.exe" "$prefix/share/gabbaboy/fixtures/tracer/tracer.gb"
          done
          # This adds exact downloaded-byte verification while reusing the existing native consumer sources and toolchain.

  # Trust split for source-executing evidence (P15-01). candidate-corpus and candidate-performance run
  # tagged build, CTest and measurement code with a read-only job token, no GitHub token in their
  # environment and no persisted checkout credential. They only retain bytes as run artifacts.
  # candidate-fuzz executes no tagged code: it reads the completed exact-source ci.yml campaign through
  # the trusted validator. attach-v02-evidence holds the only write token for this evidence and runs
  # no tagged code. Note that the producers cannot see the draft, so a retry rebuilds them and the
  # attacher keeps any evidence that is already attached.
  candidate-corpus:
    name: exact-tag-corpus-and-support-sidecar
    needs: [release, candidate]
    if: ${{ always() && needs.candidate.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.retry && inputs.tag_name || needs.release.outputs.tag_name }}
      SOURCE_SHA: ${{ inputs.retry && inputs.source_sha || needs.release.outputs.sha }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact tag and tagged checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == szTheory/gabbaboy && "$GITHUB_REF" == refs/heads/main ]] || { echo "Corpus evidence runs only from trusted main workflow runs." >&2; exit 1; }
          bash .github/scripts/produce-release-evidence.sh verify-subject --subject . --source-sha "$SOURCE_SHA" --tag "$RELEASE_TAG" > /dev/null
      - name: Configure and build the exact tag with the native preset
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/produce-release-evidence.sh corpus-build --subject .
      - name: Begin exact CGB corpus receipt run
        id: corpus_run
        run: python3 -I tests/scripts/verify-cgb-corpus-report.py --begin-run --build-dir build --receipt build/cgb-corpus-receipt.json >> "$GITHUB_OUTPUT"
      - name: Run the full CTest stream once
        id: full_ctest
        continue-on-error: true
        env:
          RUN_NONCE: ${{ steps.corpus_run.outputs.run_nonce }}
        run: ctest --test-dir build -T Test --no-compress-output --test-output-size-passed 16777216 --output-on-failure --no-tests=error --output-junit "cgb-corpus-ctest-${RUN_NONCE}.xml"
      - name: Build the CGB receipt from this CTest output
        run: python3 -I tests/scripts/verify-cgb-corpus-report.py --from-ctest --build-dir build --receipt build/cgb-corpus-receipt.json
      - name: Verify public CGB claims, the current support ledger and the required test inventory
        shell: bash
        env:
          RUN_NONCE: ${{ steps.corpus_run.outputs.run_nonce }}
        run: |
          set -euo pipefail
          python3 -I tests/scripts/verify-cgb-corpus-claims.py --receipt build/cgb-corpus-receipt.json
          python3 -I tests/scripts/verify-support-ledger.py --check-current --receipt build/cgb-corpus-receipt.json
          bash .github/scripts/verify-test-inventory.sh "build/cgb-corpus-ctest-${RUN_NONCE}.xml" tests/expected-tests.txt --installed
      - name: Require the full CTest run to pass
        env:
          FULL_CTEST_OUTCOME: ${{ steps.full_ctest.outcome }}
        run: test "$FULL_CTEST_OUTCOME" = success
      - name: Generate and validate the schema-2 support sidecar from the exact receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tests/scripts/verify-support-ledger.py --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" \
            --receipt build/cgb-corpus-receipt.json --output build/support-ledger.json
          python3 -I tests/scripts/verify-support-ledger.py --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" \
            --receipt build/cgb-corpus-receipt.json --verify-sidecar build/support-ledger.json
      - name: Retain the corpus receipt and support sidecar for the separate attacher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-corpus
          path: |
            build/cgb-corpus-receipt.json
            build/support-ledger.json
          if-no-files-found: error
          retention-days: 7

  candidate-fuzz:
    name: exact-source-ci-campaign-receipt-reader
    needs: [release, candidate]
    if: ${{ always() && needs.candidate.result == 'success' }}
    runs-on: ubuntu-24.04
    # Worst case 3000 (poll deadline) + 60 (request timeout) + 30 (interval) + 2700 (hosted poll) + 900
    # (margin for checkout, run download, artifact upload, verifier startup and final-iteration overshoot) = 6690 s <= 6720 s.
    timeout-minutes: 112
    permissions:
      actions: read
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.retry && inputs.tag_name || needs.release.outputs.tag_name }}
      SOURCE_SHA: ${{ inputs.retry && inputs.source_sha || needs.release.outputs.sha }}
      CI_RUN_WAIT_ATTEMPTS: 90
      CI_RUN_WAIT_SECONDS: 30
      CI_RUN_WAIT_DEADLINE_SECONDS: 3000
      CI_RUN_REQUEST_TIMEOUT_SECONDS: 60
      HOSTED_POLL_SECONDS: 2700
    steps:
      # Trusted workflow revision only. The release campaign is not executed here: this workflow's own
      # campaign never qualified, so the judge consumes the completed exact-source ci.yml push campaign.
      - name: Check out the trusted workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Require trusted main and read the exact CI campaign receipt through the trusted validator
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GH_REPO" == szTheory/gabbaboy && "$GITHUB_REF" == refs/heads/main ]] || { echo "Fuzz evidence runs only from trusted main workflow runs." >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Malformed release tag or source SHA." >&2; exit 1; }
          [[ "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" == "$SOURCE_SHA" ]] || {
            echo "Release tag does not resolve to the source SHA." >&2
            exit 1
          }
          # The source is bound by the tag API check above and by the trusted verifier below (commit object,
          # commit-tree manifest, API push run on main at the source SHA). HEAD is the judge, never the subject:
          # on a retry main may have moved past the release commit, so nothing here compares HEAD with SOURCE_SHA.
          run_id=""
          poll_start=$SECONDS
          attempts_made=0
          for attempt_number in $(seq 1 "$CI_RUN_WAIT_ATTEMPTS"); do
            if [[ $((SECONDS - poll_start)) -ge "$CI_RUN_WAIT_DEADLINE_SECONDS" ]]; then break; fi
            attempts_made=$attempt_number
            runs=$(timeout "$CI_RUN_REQUEST_TIMEOUT_SECONDS" gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&event=push&branch=main&per_page=100") || {
              echo "BLOCKING LIMITATION: ci.yml run lookup failed or exceeded the request timeout (attempt $attempt_number, elapsed $((SECONDS - poll_start))s)." >&2
              exit 1
            }
            run_id=$(jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | max_by([.run_number, .id]) | select(. != null and .status == "completed") | .id' <<<"$runs")
            [[ -n "$run_id" && "$run_id" != null ]] && break
            sleep "$CI_RUN_WAIT_SECONDS"
          done
          [[ -n "$run_id" && "$run_id" != null ]] || { echo "BLOCKING LIMITATION: no completed exact-source ci.yml push campaign exists after $attempts_made attempts and $((SECONDS - poll_start))s (deadline ${CI_RUN_WAIT_DEADLINE_SECONDS}s)." >&2; exit 1; }
          attempt=$(jq -r --arg id "$run_id" '.workflow_runs[] | select((.id | tostring) == $id) | .run_attempt' <<<"$runs")
          mkdir -p build/ci-fuzz
          gh run download "$run_id" --repo "$GH_REPO" --name "v02-fuzz-$run_id-$attempt" --dir build/ci-fuzz
          test -s build/ci-fuzz/v02-fuzz-receipt.json
          python3 -I tests/scripts/verify-v02-fuzz.py --verify-hosted --source-sha "$SOURCE_SHA" \
            --run-id "$run_id" --attempt "$attempt" --receipt build/ci-fuzz/v02-fuzz-receipt.json \
            --poll-seconds "$HOSTED_POLL_SECONDS"
      - name: Retain the verified campaign receipt for the separate attacher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-fuzz
          path: trusted/build/ci-fuzz/v02-fuzz-receipt.json
          if-no-files-found: error
          retention-days: 7

  candidate-performance:
    name: exact-tag-advisory-paired-performance-observation
    needs: [release, candidate]
    if: ${{ always() && needs.candidate.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # actions: read lets one gh step fetch the qualified performance receipt of a rehearsal run of this tag.
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.retry && inputs.tag_name || needs.release.outputs.tag_name }}
      SOURCE_SHA: ${{ inputs.retry && inputs.source_sha || needs.release.outputs.sha }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact tag and tagged checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == szTheory/gabbaboy && "$GITHUB_REF" == refs/heads/main ]] || { echo "Performance evidence runs only from trusted main workflow runs." >&2; exit 1; }
          bash .github/scripts/produce-release-evidence.sh verify-subject --subject . --source-sha "$SOURCE_SHA" --tag "$RELEASE_TAG" > /dev/null
      - name: Fetch the newest successful rehearsal run's performance receipt for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rehearsal-performance"
          # The newest successful rehearsal run is reused only when it provably built the tagged tree. The judge is the
          # trusted workflow revision's copy, never the tagged tree's: it binds the run to the rehearsal workflow, an allowed
          # event, completed success, this tag's rehearsal branch and this repository, and the head to the tagged tree from git
          # objects. The artifact must be this exact run and attempt's upload. A refusal means a fresh measurement, never an
          # older run, and the reason stays in the log.
          git show "${GITHUB_SHA}:.github/scripts/verify-release-source-proof.py" > "$RUNNER_TEMP/verify-release-source-proof.py"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-rehearsal.yml/runs?branch=rehearsal/$RELEASE_TAG&status=success&per_page=100" > "$RUNNER_TEMP/rehearsal-runs.json"
          if run_id=$(python3 -I "$RUNNER_TEMP/verify-release-source-proof.py" --select-performance-run "$RUNNER_TEMP/rehearsal-runs.json" --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" --selected-run "$RUNNER_TEMP/rehearsal-run.json"); then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$RUNNER_TEMP/rehearsal-artifacts.json"
            if artifact=$(python3 -I "$RUNNER_TEMP/verify-release-source-proof.py" --select-performance-artifact "$RUNNER_TEMP/rehearsal-artifacts.json" --selected-run "$RUNNER_TEMP/rehearsal-run.json"); then
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/rehearsal-performance" || echo "::notice::The rehearsal performance artifact could not be downloaded; the receipt is measured instead."
            else
              echo "::notice::No reusable rehearsal performance artifact; the receipt is measured instead."
            fi
          else
            echo "::notice::No rehearsal run of the tagged tree is reusable; the receipt is measured instead."
          fi
      - name: Reuse the qualified rehearsal receipt of this exact tree, else measure the clean paired v0.1.0 baseline and exact-tag candidate
        shell: bash
        run: |
          set -euo pipefail
          # This receipt reports paired wall-clock timing as advisory evidence. The required CI/rehearsal
          # cachegrind Ir and realtime gates remain independent blockers, and the owner verifier checks its bindings.
          mkdir -p build
          reused=false
          found=$(find "$RUNNER_TEMP/rehearsal-performance" -name v02-performance-receipt.json)
          tag_tree=$(git rev-parse "$SOURCE_SHA^{tree}")
          if [[ -n "$found" && "$(printf '%s\n' "$found" | wc -l)" == 1 ]] && python3 -I tests/scripts/verify-v02-performance.py --verify-reuse "$found" --tag-tree "$tag_tree"; then
            cp "$found" build/v02-performance-receipt.json
            reused=true
          fi
          if [[ "$reused" != true ]]; then
            bash tests/scripts/measure-release-baseline.sh --qualify-v02 --output build/v02-performance-receipt.json
          fi
          python3 -I tests/scripts/verify-v02-performance.py --verify build/v02-performance-receipt.json
      - name: Retain the performance receipt for the separate attacher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-performance
          path: build/v02-performance-receipt.json
          if-no-files-found: error
          retention-days: 7

  attach-v02-evidence:
    name: attach-qualified-v02-evidence
    needs: [release, candidate, candidate-corpus, candidate-fuzz, candidate-performance]
    if: ${{ always() && needs.candidate.result == 'success' && needs.candidate-corpus.result == 'success' && needs.candidate-fuzz.result == 'success' && needs.candidate-performance.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.retry && inputs.tag_name || needs.release.outputs.tag_name }}
      SOURCE_SHA: ${{ inputs.retry && inputs.source_sha || needs.release.outputs.sha }}
      INPUT_RELEASE_ID: ${{ inputs.retry && inputs.release_id || '' }}
      RETRY: ${{ inputs.retry }}
    steps:
      # This job holds the only write token for the evidence. It executes no tagged code; the one checkout is the
      # trusted workflow revision, whose recovery judge decides from live state before any write.
      - name: Check out the trusted workflow revision as the recovery judge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Download the corpus producer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence-corpus
          path: build/evidence-corpus
      - name: Download the verified fuzz campaign artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence-fuzz
          path: build/evidence-fuzz
      - name: Download the performance producer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence-performance
          path: build/evidence-performance
      - name: Require the exact tag and one unpublished draft, then attach evidence without replacing any asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash trusted/.github/scripts/release-evidence-lifecycle.sh attach-evidence

  candidate-platform-manifest:
    name: fail-closed-platform-asset-manifest
    needs: [release, candidate, candidate-macos, candidate-windows, candidate-corpus, candidate-fuzz, candidate-performance, attach-v02-evidence]
    if: ${{ always() && needs.candidate.result == 'success' && needs.candidate-macos.result == 'success' && needs.candidate-windows.result == 'success' && needs.candidate-corpus.result == 'success' && needs.candidate-fuzz.result == 'success' && needs.candidate-performance.result == 'success' && needs.attach-v02-evidence.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.retry && inputs.tag_name || needs.release.outputs.tag_name }}
      SOURCE_SHA: ${{ inputs.retry && inputs.source_sha || needs.release.outputs.sha }}
      RELEASE_ID: ${{ inputs.retry && inputs.release_id || '' }}
    steps:
      - name: Check out exact tagged source for support and performance receipts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      # The judge is the trusted workflow revision, never the tagged tree: the tagged checkout above is data.
      - name: Check out the trusted workflow revision as the judge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the attached v0.2 evidence families through their owner validators
        shell: bash
        run: bash trusted/.github/scripts/release-evidence-lifecycle.sh validate-evidence
      - name: Validate the exact candidate asset set after platform smoke
        shell: bash
        run: bash trusted/.github/scripts/release-evidence-lifecycle.sh build-manifest

  publish-qualified-release:
    name: final-downloaded-byte-gate-and-publish
    needs: [release, candidate, candidate-macos, candidate-windows, candidate-platform-manifest]
    if: ${{ always() && needs.candidate.result == 'success' && needs.candidate-macos.result == 'success' && needs.candidate-windows.result == 'success' && needs.candidate-platform-manifest.result == 'success' && ((inputs.retry == true) || (needs.release.result == 'success' && needs.release.outputs.release_created == 'true')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.retry && inputs.tag_name || needs.release.outputs.tag_name }}
      SOURCE_SHA: ${{ inputs.retry && inputs.source_sha || needs.release.outputs.sha }}
      INPUT_RELEASE_ID: ${{ inputs.retry && inputs.release_id || '' }}
    steps:
      - name: Require trusted source and all candidate jobs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GH_REPO" == szTheory/gabbaboy && "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" == "$SOURCE_SHA" ]] || {
            echo "Release tag does not resolve to release-please's exact source SHA." >&2; exit 1;
          }
          version=${RELEASE_TAG#v}
          source_version=$(gh api "repos/$GH_REPO/contents/CMakeLists.txt?ref=$SOURCE_SHA" --jq .content | base64 --decode | sed -nE 's/^project\(GabbaBoy VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n1)
          [[ "$source_version" == "$version" ]] || { echo "Release tag and exact tagged CMake version differ." >&2; exit 1; }
          release_json=$(gh api "repos/$GH_REPO/releases?per_page=100")
          [[ $(jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | length' <<<"$release_json") == 1 ]] || {
            echo "Expected exactly one GitHub Release for the tag." >&2; exit 1;
          }
          release_id=$(jq --arg tag "$RELEASE_TAG" -r '.[] | select(.tag_name == $tag) | .id' <<<"$release_json")
          [[ $(jq --arg tag "$RELEASE_TAG" -r '.[] | select(.tag_name == $tag) | .draft' <<<"$release_json") == true ]] || {
            echo "The existing release is not an unpublished draft." >&2; exit 1;
          }
          [[ -z "$INPUT_RELEASE_ID" || "$INPUT_RELEASE_ID" == "$release_id" ]] || {
            echo "Retry release ID differs from the existing draft." >&2; exit 1;
          }
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
      - name: Check out exact tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      # The judge is the trusted workflow revision, never the tagged tree: the tagged checkout above is data.
      - name: Check out the trusted workflow revision as the judge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Load trusted release evidence verifiers
        shell: bash
        run: |
          set -euo pipefail
          git show "${GITHUB_SHA}:.github/scripts/verify-release-source-proof.py" > "$RUNNER_TEMP/verify-release-source-proof.py"
      - name: Validate draft candidate and all downloaded platform bytes
        shell: bash
        run: bash trusted/.github/scripts/release-evidence-lifecycle.sh validate-draft
      - name: Recheck final API inventory and downloaded receipts
        run: bash trusted/.github/scripts/release-evidence-lifecycle.sh final-gate
      # RM-030 (D-22): the full ASan stall replay of the exact tagged tree must have succeeded, judged by the trusted
      # revision's gate immediately before the one publication transition.
      - name: Require the successful exact-tree nightly ASan replay
        shell: bash
        run: bash trusted/.github/scripts/release-evidence-lifecycle.sh nightly-gate
      - name: Publish the one qualified draft
        shell: bash
        run: bash trusted/.github/scripts/release-evidence-lifecycle.sh publish-draft
