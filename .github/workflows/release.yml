      - name: Select an existing Windows archive or a clean build
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100")
          names=(gabbaboy-core-windows-x64.tar.gz gabbaboy-core-windows-x64.tar.gz.sha256 gabbaboy-build-receipt-windows-x64.json)
