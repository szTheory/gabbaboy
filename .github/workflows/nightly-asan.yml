name: nightly-asan

# Scheduled and dispatchable full ASan stall replay (Phase 16 D-19, amended by D-108). The pull-request ASan lane
# runs the bounded replay acceptance_stall_bounded and excludes the three full stall tests; this lane runs them.
# Dispatch it by hand after it reaches main: `gh workflow run nightly-asan.yml --ref main`.
#
# D-108: the red-nightly report is a separate report-red job, not an inline step. The replay job builds and runs
# repository code, so it holds contents: read only; the issues: write token lives in report-red, which has no
# checkout and runs no repository code. .github/scripts/verify-workflow-policy.py (check_nightly) judges both.
#
# The red report is bounded and deduplicated exactly: its reporting step has its own timeout, an open issue is reused only
# when its title equals the nightly-red title AND it carries the nightly-red label (a phrase match on an unrelated issue
# never qualifies), and the nightly-red label is created first when it is missing. A manual dispatch with
# report_red_dry_run=true skips the replay and runs the same reporting body with every issue and label write replaced by a
# recorded line; the read-only issue listing is still real. That run is the measured evidence for the job's timeout citation.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      report_red_dry_run:
        description: "Skip the replay and run the red report with a recording stand-in that opens no issue"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  asan-full-replay:
    name: asan-full-replay
    if: ${{ !inputs.report_red_dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm pinned Clang 18 toolchain
        run: |
          test "$(clang-18 -dumpversion | cut -d. -f1)" = 18
          test "$(clang++-18 -dumpversion | cut -d. -f1)" = 18
      - name: Configure ASan and UBSan
        run: cmake --preset phase1-asan -DGBB_TEST_INSTALL_PREFIX=
      - name: Confirm sanitizer cache option
        run: cmake -LA -N build-asan | grep -q '^GABBABOY_ENABLE_SANITIZERS:BOOL=ON$'
      - name: Build
        run: cmake --build --preset phase1-asan
      - name: Run the full ASan stall replay
        run: ctest --preset phase1-asan --parallel 2 -R '^acceptance_stall_diagnosis(_replay_[12])?$' --output-on-failure --no-tests=error

  report-red:
    name: report-red
    needs: asan-full-replay
    if: ${{ failure() || (always() && inputs.report_red_dry_run) }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-red issue
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: "nightly-red: asan-full-replay"
          ISSUE_LABEL: nightly-red
          DRY_RUN: ${{ inputs.report_red_dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          body="The full ASan stall replay failed: $RUN_URL"
          # The only calls that change GitHub. A dry run records them and sends nothing.
          issue_write() {
            if [ "$DRY_RUN" = true ]; then
              printf 'DRY-RUN not sent: gh %s\n' "$*"
            else
              gh "$@"
            fi
          }
          if [ "$(gh label list --limit 200 --json name --jq 'any(.[]; .name == env.ISSUE_LABEL)')" != true ]; then
            issue_write label create "$ISSUE_LABEL" --description "Nightly ASan stall replay failed" --color B60205
          fi
          number=$(gh issue list --state open --label "$ISSUE_LABEL" --limit 100 --json number,title,labels --jq '[.[] | select(.title == env.ISSUE_TITLE and any(.labels[]; .name == env.ISSUE_LABEL))] | sort_by(.number) | .[0].number // empty')
          if [ -n "$number" ]; then
            issue_write issue comment "$number" --body "$body"
          else
            issue_write issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$body"
          fi
