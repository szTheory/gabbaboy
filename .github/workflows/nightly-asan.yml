name: nightly-asan

# Scheduled and dispatchable full ASan stall replay (Phase 16 D-19, amended by D-108). The pull-request ASan lane
# runs the bounded replay acceptance_stall_bounded and excludes the three full stall tests; this lane runs them.
# Dispatch it by hand after it reaches main: `gh workflow run nightly-asan.yml --ref main`.
#
# D-108: the red-nightly report is a separate report-red job, not an inline step. The replay job builds and runs
# repository code, so it holds contents: read only; the issues: write token lives in report-red, which has no
# checkout and runs no repository code. .github/scripts/verify-workflow-policy.py (check_nightly) judges both.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-full-replay:
    name: asan-full-replay
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm pinned Clang 18 toolchain
        run: |
          test "$(clang-18 -dumpversion | cut -d. -f1)" = 18
          test "$(clang++-18 -dumpversion | cut -d. -f1)" = 18
      - name: Configure ASan and UBSan
        run: cmake --preset phase1-asan -DGBB_TEST_INSTALL_PREFIX=
      - name: Confirm sanitizer cache option
        run: cmake -LA -N build-asan | grep -q '^GABBABOY_ENABLE_SANITIZERS:BOOL=ON$'
      - name: Build
        run: cmake --build --preset phase1-asan
      - name: Run the full ASan stall replay
        run: ctest --preset phase1-asan --parallel 2 -R '^acceptance_stall_diagnosis(_replay_[12])?$' --output-on-failure --no-tests=error

  report-red:
    name: report-red
    needs: asan-full-replay
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="nightly-red: asan-full-replay"
          body="The full ASan stall replay failed: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
