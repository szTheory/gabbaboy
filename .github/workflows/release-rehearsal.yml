name: release-rehearsal

# Non-publishing hosted rehearsal of the source-side producers that release.yml runs on the
# exact release tag. A defect in tagged source cannot be repaired without a new tag, so these
# commands are exercised here, on a branch, before release-please is allowed to tag.
#
# Safety: read-only token, no release, tag push, upload, publish or secret use. The tag the
# producers need is created only inside the runner's checkout and is never pushed. A rehearsal
# branch is created by pushing `rehearsal/<anything>`; it proves nothing about the draft-bound
# steps (download, attach, final gate, publish), which still need a real draft.
#
# The rehearsal tag is derived from the branch, which must be rehearsal/vX.Y.Z for the tree's own version
# (CMake project VERSION cross-checked with the release-please manifest); nothing falls back to a fixed tag.
# A triggered paired measurement stays pending until a separately recorded, receipt-bound independent review
# decision exists. This workflow never creates one: dispatch it on the same rehearsal branch with the pending
# run's id and the recorded decision (docs/release.md) and it applies that decision to the retained measurement.
on:
  push:
    branches: ['rehearsal/**']
  workflow_dispatch:
    inputs:
      measurement_run_id:
        description: Run id of the release-rehearsal run on this branch whose pending paired measurement the decision covers
        required: false
        type: string
        default: ''
      performance_decision:
        description: The recorded independent review decision for that measurement, as a JSON string
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: rehearse-corpus-and-support-sidecar
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out the rehearsed source with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Derive the rehearsal tag from the ref and the tree version
        shell: bash
        run: python3 -I tests/scripts/verify-support-ledger.py --derive-rehearsal-tag "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - name: Create the local-only rehearsal tag
        shell: bash
        run: |
          set -euo pipefail
          # --local-tag repoints the runner's copy of the tag (the real release tag may already exist in a
          # full-history checkout) and never pushes; the shared producer prints the SOURCE_SHA/RELEASE_TAG lines.
          bash .github/scripts/produce-release-evidence.sh verify-subject --subject . --source-sha "$GITHUB_SHA" --tag "$REHEARSAL_TAG" --local-tag >> "$GITHUB_ENV"
      - name: Configure and build the source with the native preset
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/produce-release-evidence.sh corpus-build --subject .
      - name: Begin exact CGB corpus receipt run
        id: corpus_run
        run: python3 -I tests/scripts/verify-cgb-corpus-report.py --begin-run --build-dir build --receipt build/cgb-corpus-receipt.json >> "$GITHUB_OUTPUT"
      - name: Run the full CTest stream once
        id: full_ctest
        continue-on-error: true
        env:
          RUN_NONCE: ${{ steps.corpus_run.outputs.run_nonce }}
        run: ctest --test-dir build -T Test --no-compress-output --test-output-size-passed 16777216 --output-on-failure --no-tests=error --output-junit "cgb-corpus-ctest-${RUN_NONCE}.xml"
      - name: Build the CGB receipt from this CTest output
        run: python3 -I tests/scripts/verify-cgb-corpus-report.py --from-ctest --build-dir build --receipt build/cgb-corpus-receipt.json
      - name: Verify public CGB claims, the current support ledger and the required test inventory
        shell: bash
        env:
          RUN_NONCE: ${{ steps.corpus_run.outputs.run_nonce }}
        run: |
          set -euo pipefail
          python3 -I tests/scripts/verify-cgb-corpus-claims.py --receipt build/cgb-corpus-receipt.json
          python3 -I tests/scripts/verify-support-ledger.py --check-current --receipt build/cgb-corpus-receipt.json
          bash .github/scripts/verify-test-inventory.sh "build/cgb-corpus-ctest-${RUN_NONCE}.xml" tests/expected-tests.txt --installed
      - name: Require the full CTest run to pass
        env:
          FULL_CTEST_OUTCOME: ${{ steps.full_ctest.outcome }}
        run: test "$FULL_CTEST_OUTCOME" = success
      - name: Generate and validate the schema-2 support sidecar from the exact receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tests/scripts/verify-support-ledger.py --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" \
            --receipt build/cgb-corpus-receipt.json --output build/support-ledger.json
          python3 -I tests/scripts/verify-support-ledger.py --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" \
            --receipt build/cgb-corpus-receipt.json --verify-sidecar build/support-ledger.json

  fuzz:
    name: rehearse-clang-libfuzzer-campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out the rehearsed source with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm pinned Clang 18 toolchain
        run: |
          clang-18 --version
          clang++-18 --version
          test "$(clang-18 -dumpversion | cut -d. -f1)" = 18
          test "$(clang++-18 -dumpversion | cut -d. -f1)" = 18
      - name: Configure and build ASan and UBSan
        run: |
          cmake --preset phase1-asan -DGBB_TEST_INSTALL_PREFIX=
          cmake -LA -N build-asan | grep -q '^GABBABOY_ENABLE_SANITIZERS:BOOL=ON$'
          cmake --build --preset phase1-asan
      - name: Run the bounded Clang 18 libFuzzer campaign and verify its receipt
        env:
          GBB_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          GBB_BUILD_DIR=build-asan bash tests/scripts/run-bounded-fuzz.sh --explore --receipt build-asan/v02-fuzz-receipt.json
          python3 -I tests/scripts/verify-v02-fuzz.py --verify build-asan/v02-fuzz-receipt.json
          GBB_BUILD_DIR=build-asan bash tests/scripts/run-bounded-fuzz.sh --self-test
      - name: Retain the producer campaign receipt for the separate trusted judge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rehearsal-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-asan/v02-fuzz-receipt.json
          if-no-files-found: error
          retention-days: 3

  performance:
    name: rehearse-paired-performance-qualification
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # actions: read lets the dispatch path fetch the pending measurement of an earlier run of this workflow.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the rehearsed source with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pending measurement that the review decision covers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MEASUREMENT_RUN_ID: ${{ inputs.measurement_run_id }}
          PERFORMANCE_DECISION: ${{ inputs.performance_decision }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/measurement"
          if [[ -n "$MEASUREMENT_RUN_ID" || -n "$PERFORMANCE_DECISION" ]]; then
            # Only an operator-supplied decision for a measurement made by this workflow, on this branch, for this
            # exact tree can qualify anything; each check below fails closed.
            [[ -n "$MEASUREMENT_RUN_ID" && -n "$PERFORMANCE_DECISION" && "$MEASUREMENT_RUN_ID" =~ ^[0-9]+$ ]] || { echo "performance-decision-inputs: measurement_run_id and performance_decision must be set together" >&2; exit 1; }
            run_workflow=$(gh run view "$MEASUREMENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName --jq .workflowName)
            run_branch=$(gh run view "$MEASUREMENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headBranch --jq .headBranch)
            run_sha=$(gh run view "$MEASUREMENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
            [[ "$run_workflow" == release-rehearsal && "$run_branch" == "$GITHUB_REF_NAME" ]] || { echo "performance-decision-wrong-run: run $MEASUREMENT_RUN_ID is not a release-rehearsal run on $GITHUB_REF_NAME" >&2; exit 1; }
            [[ "$(git rev-parse "$run_sha^{tree}")" == "$(git rev-parse "$GITHUB_SHA^{tree}")" ]] || { echo "performance-decision-tree-mismatch: the measured tree is not this run's tree" >&2; exit 1; }
            gh run download "$MEASUREMENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'rehearsal-performance-*' --dir "$RUNNER_TEMP/measurement"
          fi
      - name: Measure the clean paired v0.1.0 baseline and candidate
        shell: bash
        env:
          MEASUREMENT_RUN_ID: ${{ inputs.measurement_run_id }}
          PERFORMANCE_DECISION: ${{ inputs.performance_decision }}
        run: |
          set -euo pipefail
          mkdir -p build
          if [[ -z "$MEASUREMENT_RUN_ID" && -z "$PERFORMANCE_DECISION" ]]; then
            bash tests/scripts/measure-release-baseline.sh --qualify-v02 --output build/v02-performance-receipt.json
          else
            measurement=$(find "$RUNNER_TEMP/measurement" -name v02-performance-receipt.json)
            [[ -n "$measurement" && "$(printf '%s\n' "$measurement" | wc -l)" == 1 ]] || { echo "performance-decision-measurement: expected exactly one retained measurement" >&2; exit 1; }
            printf '%s' "$PERFORMANCE_DECISION" > "$RUNNER_TEMP/performance-decision.json"
            python3 -I tests/scripts/verify-v02-performance.py --apply-decision --measurement "$measurement" --decision "$RUNNER_TEMP/performance-decision.json" --output build/v02-performance-receipt.json
          fi
          python3 -I tests/scripts/verify-v02-performance.py --verify build/v02-performance-receipt.json
      - name: Retain the measurement or qualified receipt for review and for the release
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rehearsal-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/v02-performance-receipt.json
          if-no-files-found: ignore
          retention-days: 7

  perf-gate:
    name: rehearse-perf-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the rehearsed source with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The gate builds v0.2.0 in the same job and verifies the tag, so it needs tags and history.
          fetch-depth: 0
          persist-credentials: false
      - name: Install valgrind
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y valgrind || { sleep 20; sudo apt-get update -qq; sudo apt-get install -y valgrind; }
      - name: Gate cachegrind Ir against v0.2.0 and the realtime floor
        shell: bash
        run: bash tests/scripts/run-perf-gate.sh --gate
      - name: Prove the gate rejects a seeded regression
        shell: bash
        run: bash tests/scripts/run-perf-gate.sh --seeded-regression
      - name: Prove the gate accepts a no-op twin patch
        shell: bash
        run: bash tests/scripts/run-perf-gate.sh --noop-twin

  package:
    name: rehearse-package-consumers-and-archive
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out the rehearsed source with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Derive the rehearsal tag from the ref and the tree version
        shell: bash
        run: python3 -I tests/scripts/verify-support-ledger.py --derive-rehearsal-tag "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - name: Create the local-only rehearsal tag
        shell: bash
        run: |
          set -euo pipefail
          # --local-tag repoints the runner's copy of the tag (the real release tag may already exist in a
          # full-history checkout) and never pushes; the shared producer prints the SOURCE_SHA/RELEASE_TAG lines.
          bash .github/scripts/produce-release-evidence.sh verify-subject --subject . --source-sha "$GITHUB_SHA" --tag "$REHEARSAL_TAG" --local-tag >> "$GITHUB_ENV"
      - name: Configure and build the cache-free release core package
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DGABBABOY_BUILD_PLAYER=OFF
          cmake --build build/release --parallel 2
          cmake --install build/release --prefix build/release-stage
          mkdir -p build/release-stage/share/gabbaboy
          cp LICENSE build/release-stage/share/gabbaboy/LICENSE.txt
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$SOURCE_SHA")
          export SOURCE_DATE_EPOCH
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -czf build/gabbaboy-core-linux-x64.tar.gz -C build/release-stage include lib bin share
      - name: Prove relocated C and C++ consumer behavior on the extracted package bytes
        shell: bash
        run: |
          set -euo pipefail
          bash tests/scripts/verify-release-candidate.sh --extract \
            build/gabbaboy-core-linux-x64.tar.gz "$RUNNER_TEMP/v02-extracted"
          # The hardened verifier needs a candidate manifest binding the archive to the source and build; the
          # rehearsal built both itself, so it writes one (the release gate gets its own from the build receipt).
          python3 -I tests/scripts/verify-v02-consumers.py --write-candidate-manifest "$RUNNER_TEMP/candidate-manifest.json" \
            --archive build/gabbaboy-core-linux-x64.tar.gz --source-sha "$SOURCE_SHA" --build-receipt build/release/CMakeCache.txt
          python3 -I tests/scripts/verify-v02-consumers.py --prefix "$RUNNER_TEMP/v02-extracted" \
            --archive build/gabbaboy-core-linux-x64.tar.gz --candidate-manifest "$RUNNER_TEMP/candidate-manifest.json" \
            --output build/v02-consumer-receipt.json
      - name: Inspect a git-generated source archive of the rehearsed tree
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's tag archive is `git archive` with a <name>-<version>/ root. The real tag archive
          # does not exist yet, so build the equivalent from the local-only tag and run the same checker.
          archive="$RUNNER_TEMP/source-archive.tar.gz"
          git archive --format=tar.gz --prefix="gabbaboy-${RELEASE_TAG#v}/" -o "$archive" "$RELEASE_TAG"
          python3 -I tests/scripts/verify-v02-source-archive.py --archive "$archive" \
            --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --repo . --output build/source-archive-receipt.json
          python3 -I tests/scripts/verify-v02-source-archive.py --check-receipt build/source-archive-receipt.json \
            --archive "$archive" --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --repo .

  aggregate:
    name: rehearse-v02-evidence-aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the rehearsed source with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Derive the rehearsal tag from the ref and the tree version
        shell: bash
        run: python3 -I tests/scripts/verify-support-ledger.py --derive-rehearsal-tag "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - name: Create the local-only rehearsal tag
        shell: bash
        run: |
          set -euo pipefail
          # --local-tag repoints the runner's copy of the tag (the real release tag may already exist in a
          # full-history checkout) and never pushes; the shared producer prints the SOURCE_SHA/RELEASE_TAG lines.
          bash .github/scripts/produce-release-evidence.sh verify-subject --subject . --source-sha "$GITHUB_SHA" --tag "$REHEARSAL_TAG" --local-tag >> "$GITHUB_ENV"
      - name: Corpus receipt and support sidecar
        id: corpus_run
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/produce-release-evidence.sh corpus-build --subject .
          nonce=$(python3 -I tests/scripts/verify-cgb-corpus-report.py --begin-run --build-dir build --receipt build/cgb-corpus-receipt.json | sed -n 's/^run_nonce=//p')
          ctest --test-dir build -T Test --no-compress-output --test-output-size-passed 16777216 --output-on-failure --no-tests=error --output-junit "cgb-corpus-ctest-$nonce.xml"
          python3 -I tests/scripts/verify-cgb-corpus-report.py --from-ctest --build-dir build --receipt build/cgb-corpus-receipt.json
          python3 -I tests/scripts/verify-cgb-corpus-claims.py --receipt build/cgb-corpus-receipt.json
          python3 -I tests/scripts/verify-support-ledger.py --check-current --receipt build/cgb-corpus-receipt.json
          python3 -I tests/scripts/verify-support-ledger.py --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" \
            --receipt build/cgb-corpus-receipt.json --output build/support-ledger.json
          python3 -I tests/scripts/verify-support-ledger.py --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" \
            --receipt build/cgb-corpus-receipt.json --verify-sidecar build/support-ledger.json
      - name: Fuzz campaign receipt
        env:
          CC: clang-18
          CXX: clang++-18
          GBB_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset phase1-asan -DGBB_TEST_INSTALL_PREFIX=
          cmake --build --preset phase1-asan
          GBB_BUILD_DIR=build-asan bash tests/scripts/run-bounded-fuzz.sh --explore --receipt build-asan/v02-fuzz-receipt.json
          python3 -I tests/scripts/verify-v02-fuzz.py --verify build-asan/v02-fuzz-receipt.json
          cp build-asan/v02-fuzz-receipt.json build/v02-fuzz-receipt.json
      - name: Fetch the pending measurement that the review decision covers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MEASUREMENT_RUN_ID: ${{ inputs.measurement_run_id }}
          PERFORMANCE_DECISION: ${{ inputs.performance_decision }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/measurement"
          if [[ -n "$MEASUREMENT_RUN_ID" || -n "$PERFORMANCE_DECISION" ]]; then
            # Only an operator-supplied decision for a measurement made by this workflow, on this branch, for this
            # exact tree can qualify anything; each check below fails closed.
            [[ -n "$MEASUREMENT_RUN_ID" && -n "$PERFORMANCE_DECISION" && "$MEASUREMENT_RUN_ID" =~ ^[0-9]+$ ]] || { echo "performance-decision-inputs: measurement_run_id and performance_decision must be set together" >&2; exit 1; }
            run_workflow=$(gh run view "$MEASUREMENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName --jq .workflowName)
            run_branch=$(gh run view "$MEASUREMENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headBranch --jq .headBranch)
            run_sha=$(gh run view "$MEASUREMENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
            [[ "$run_workflow" == release-rehearsal && "$run_branch" == "$GITHUB_REF_NAME" ]] || { echo "performance-decision-wrong-run: run $MEASUREMENT_RUN_ID is not a release-rehearsal run on $GITHUB_REF_NAME" >&2; exit 1; }
            [[ "$(git rev-parse "$run_sha^{tree}")" == "$(git rev-parse "$GITHUB_SHA^{tree}")" ]] || { echo "performance-decision-tree-mismatch: the measured tree is not this run's tree" >&2; exit 1; }
            gh run download "$MEASUREMENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'rehearsal-performance-*' --dir "$RUNNER_TEMP/measurement"
          fi
      - name: Paired performance receipt
        shell: bash
        env:
          MEASUREMENT_RUN_ID: ${{ inputs.measurement_run_id }}
          PERFORMANCE_DECISION: ${{ inputs.performance_decision }}
        run: |
          set -euo pipefail
          mkdir -p build
          if [[ -z "$MEASUREMENT_RUN_ID" && -z "$PERFORMANCE_DECISION" ]]; then
            bash tests/scripts/measure-release-baseline.sh --qualify-v02 --output build/v02-performance-receipt.json
          else
            measurement=$(find "$RUNNER_TEMP/measurement" -name v02-performance-receipt.json)
            [[ -n "$measurement" && "$(printf '%s\n' "$measurement" | wc -l)" == 1 ]] || { echo "performance-decision-measurement: expected exactly one retained measurement" >&2; exit 1; }
            printf '%s' "$PERFORMANCE_DECISION" > "$RUNNER_TEMP/performance-decision.json"
            python3 -I tests/scripts/verify-v02-performance.py --apply-decision --measurement "$measurement" --decision "$RUNNER_TEMP/performance-decision.json" --output build/v02-performance-receipt.json
          fi
          python3 -I tests/scripts/verify-v02-performance.py --verify build/v02-performance-receipt.json
      - name: Relocated consumer receipt and source archive receipt
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DGABBABOY_BUILD_PLAYER=OFF
          cmake --build build/release --parallel 2
          cmake --install build/release --prefix build/release-stage
          mkdir -p build/release-stage/share/gabbaboy
          cp LICENSE build/release-stage/share/gabbaboy/LICENSE.txt
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$SOURCE_SHA")
          export SOURCE_DATE_EPOCH
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -czf build/gabbaboy-core-linux-x64.tar.gz -C build/release-stage include lib bin share
          # The product-package fixture-leak check judges the real package layout (members at the archive top level).
          python3 -I tests/scripts/verify-v02-source-archive.py --check-product-archive build/gabbaboy-core-linux-x64.tar.gz --repo-root .
          bash tests/scripts/verify-release-candidate.sh --extract build/gabbaboy-core-linux-x64.tar.gz "$RUNNER_TEMP/v02-extracted"
          python3 -I tests/scripts/verify-v02-consumers.py --write-candidate-manifest "$RUNNER_TEMP/candidate-manifest.json" --archive build/gabbaboy-core-linux-x64.tar.gz --source-sha "$SOURCE_SHA" --build-receipt build/release/CMakeCache.txt
          python3 -I tests/scripts/verify-v02-consumers.py --prefix "$RUNNER_TEMP/v02-extracted" --archive build/gabbaboy-core-linux-x64.tar.gz --candidate-manifest "$RUNNER_TEMP/candidate-manifest.json" --output build/v02-consumer-receipt.json
          git archive --format=tar.gz --prefix="gabbaboy-${RELEASE_TAG#v}/" -o "$RUNNER_TEMP/source-archive.tar.gz" "$RELEASE_TAG"
          python3 -I tests/scripts/verify-v02-source-archive.py --archive "$RUNNER_TEMP/source-archive.tar.gz" \
            --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --repo . --output build/source-archive-receipt.json
      - name: Validate the six evidence families together through the release gate owner validators
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/produce-release-evidence.sh collect --subject . --output build/evidence
          bash .github/scripts/produce-release-evidence.sh verify --judge . --subject . --source-sha "$SOURCE_SHA" --tag "$RELEASE_TAG" --evidence build/evidence --archive "$RUNNER_TEMP/source-archive.tar.gz"

  # Trust split: every job above runs code from the rehearsed branch with a read-only token. This
  # job runs only after all of them completed, takes its judge code from the repository's default
  # branch (never from the rehearsed commit) and reads the rehearsed commit and the retained
  # producer bytes as data. A rehearsal run proves nothing until the judge exists on that branch.
  judge:
    name: rehearse-trusted-judge
    needs: [corpus, fuzz, performance, perf-gate, package, aggregate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the trusted judge code from the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-judge
          persist-credentials: false
      - name: Check out the rehearsed commit as data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: subject
          persist-credentials: false
      - name: Read back the retained fuzz producer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rehearsal-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: rehearsal-evidence
      - name: Judge workflow privilege and trust wiring from the trusted checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 -I trusted-judge/.github/scripts/verify-workflow-policy.py --check --root subject --release-head
      - name: Confirm the rehearsal ref names the rehearsed tree's own version
        shell: bash
        run: |
          set -euo pipefail
          python3 -I trusted-judge/tests/scripts/verify-support-ledger.py --derive-rehearsal-tag "$GITHUB_REF_NAME" --root subject
      - name: Verify the retained rehearsal campaign receipt with the trusted validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -I trusted-judge/tests/scripts/verify-v02-fuzz.py --verify rehearsal-evidence/v02-fuzz-receipt.json
