name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:

permissions:
  contents: read

jobs:
  changes:
    # D-21: classifies the change as planning-only or full. The classifier is the copy stored at the BASE commit, so a
    # change cannot loosen the rule that judges it; a base without the file, an unresolvable base, an all-zero push
    # parent (new branch, force-push) or any classifier error all mean kind=full. Read-only; never a required context.
    name: changes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - name: Check out source with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change with the base commit's classifier
        id: classify
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          verdict="kind=full reason=base-without-classifier"
          if [ -z "${base//0/}" ] || ! git cat-file -e "${base}^{commit}"; then
            verdict="kind=full reason=base-unavailable"
          elif git show "$base:.github/scripts/classify-changes.py" > "$RUNNER_TEMP/classify-changes.py"; then
            verdict=$(python3 -I "$RUNNER_TEMP/classify-changes.py" --base "$base" --head "$GITHUB_SHA" --ref "$GITHUB_REF" || echo "kind=full reason=classifier-error")
          fi
          echo "$verdict"
          kind=full
          if [ "$verdict" = "kind=planning" ]; then
            kind=planning
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  planning-checks:
    # D-21/D-22: the cheap lane for a planning-only change. It configures without building and runs only the tests
    # labelled planning; required-native then needs this job to succeed and every heavy job to be skipped.
    name: planning-checks
    needs: changes
    if: needs.changes.outputs.kind == 'planning'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure without building
        run: cmake --preset phase1 -DGBB_TEST_INSTALL_PREFIX=
      - name: Run the planning-labelled tests
        run: ctest --test-dir build -L planning --no-tests=error --output-on-failure

  native-linux:
    name: native-linux-x64
    # Timeout ledger (D-20): p50 11.07 min in main run 40159200194; 31 keeps a margin over ceil(2 x p50) for slow hosted days.
    runs-on: ubuntu-22.04
    timeout-minutes: 31
    needs: changes
    if: needs.changes.outputs.kind == 'full'
    env:
      # Serially the native suite took about 20 of each job's minutes; every ctest call runs 4 at once, like the floor job.
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # v02 performance self-tests read the v0.1.0 baseline commit and tag.
          fetch-depth: 0
          persist-credentials: false
      - name: Self-test the exact-head CI gate
        run: python3 .github/scripts/wait-exact-head-ci.py --self-test
      - name: Self-test the player result gate
        run: bash .github/scripts/check-player-result.sh --self-test
      - name: Self-test CTest platform inventory filter
        shell: bash
        run: bash .github/scripts/verify-test-inventory.sh --self-test
      - name: Self-test the release support-ledger binding
        run: python3 tests/scripts/verify-support-ledger.py --self-test
      - name: Self-test the release gates
        run: bash .github/scripts/verify-release-gates.sh --self-test
      - name: Resolve immutable state pin base
        id: state_pin_base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            test -n "$base"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE"
            test -n "$base"
            if [ -z "${base//0/}" ]; then
              base=$(git merge-base HEAD origin/main)
            fi
          else
            echo "Unsupported CI event for immutable state pin base: $EVENT_NAME" >&2
            exit 1
          fi
          git cat-file -e "${base}^{commit}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Configure
        env:
          STATE_PIN_BASE: ${{ steps.state_pin_base.outputs.base }}
        run: |
          mkdir -p build/package-prefix
          cmake --preset phase1 -DGBB_TEST_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/package-prefix" -DGBB_STATE_PIN_BASE_REV="$STATE_PIN_BASE"
      - name: Resolve the per-test budget base commit
        id: budget_base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # D-18: the PR base, or the push parent. A push that creates a branch or tag has an all-zero parent, and
          # a rebased or force-pushed branch has a parent that no fetched ref reaches any more; both are judged
          # against the merge base with origin/main. An empty or still-unresolvable base fails the step.
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "${base//0/}" ] || ! git cat-file -e "${base}^{commit}"; then
            base=$(git merge-base HEAD origin/main)
          fi
          git cat-file -e "${base}^{commit}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Check per-test TIMEOUT budgets against the base allowlist
        env:
          BUDGET_BASE: ${{ steps.budget_base.outputs.base }}
        run: python3 -I tests/scripts/verify-test-budget.py --build-dir build --base "$BUDGET_BASE"
      - name: Build
        run: cmake --build --preset phase1 --verbose
      - name: Run state pins against the immutable event base
        env:
          GBB_STATE_PIN_RECEIPT: ${{ github.workspace }}/build/state-pin-receipt.json
          GBB_STATE_PLATFORM: linux-x64
        run: ctest --test-dir build -R '^state_portable_pins$' --output-on-failure --no-tests=error
      - name: Record acceptance and Mooneye observations
        shell: bash
        run: |
          # D-33: the same observation lines must come out on every native OS at the same head.
          runner=build/gabbaboy-runner
          echo "== acceptance libbet =="
          "$runner" --acceptance tests/acceptance/cases.txt --case libbet --observe
          echo "== acceptance libbet-no-input =="
          "$runner" --acceptance tests/acceptance/cases.txt --case libbet-no-input --observe
          echo "== mooneye suite =="
          "$runner" --manifest fixtures/mooneye/manifest.json --suite --observe
      - name: Install package
        run: cmake --install build --prefix build/package-prefix
      - name: Begin exact CGB corpus receipt run
        id: corpus_run
        run: python3 -I tests/scripts/verify-cgb-corpus-report.py --begin-run --build-dir build --receipt build/cgb-corpus-receipt.json >> "$GITHUB_OUTPUT"
      - name: Run the full CTest stream once
        id: full_ctest
        continue-on-error: true
        run: ctest --test-dir build -T Test --no-compress-output --test-output-size-passed 16777216 --output-on-failure --no-tests=error --output-junit "cgb-corpus-ctest-${{ steps.corpus_run.outputs.run_nonce }}.xml"
      - name: Build the CGB receipt from this CTest output
        if: always()
        run: python3 -I tests/scripts/verify-cgb-corpus-report.py --from-ctest --build-dir build --receipt build/cgb-corpus-receipt.json
      - name: Verify public CGB claims against the fresh receipt
        if: always()
        run: python3 -I tests/scripts/verify-cgb-corpus-claims.py --receipt build/cgb-corpus-receipt.json
      - name: Verify required test inventory from the same CTest output
        if: always()
        run: bash .github/scripts/verify-test-inventory.sh "build/cgb-corpus-ctest-${{ steps.corpus_run.outputs.run_nonce }}.xml" tests/expected-tests.txt --installed
      - name: Retain state pin receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: state-pins-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/state-pin-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Require the full CTest run to pass
        if: always()
        env:
          FULL_CTEST_OUTCOME: ${{ steps.full_ctest.outcome }}
        run: test "$FULL_CTEST_OUTCOME" = success
      - name: Verify privacy-safe corpus artifact payload
        if: always()
        run: python3 -I tests/scripts/verify-cgb-corpus-artifacts.py --check --build-dir build
      - name: Retain privacy-safe corpus receipt and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cgb-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/cgb-corpus-receipt.json
            build/cgb-corpus-build-stamp.json
            build/cgb-corpus-run.json
            build/cgb-corpus-public-artifacts.json
          if-no-files-found: warn
          retention-days: 7
      - name: Print no-host-clock proof
        shell: bash
        run: ctest --test-dir build -R '^no_host_clock$' --no-tests=error -V
      - name: Print DMG baseline check result
        shell: bash
        run: bash tests/scripts/verify-dmg-baseline.sh
      - name: Verify DMG baseline JUnit inventory
        shell: bash
        run: bash tests/scripts/verify-dmg-baseline.sh --junit "build/cgb-corpus-ctest-${{ steps.corpus_run.outputs.run_nonce }}.xml" --inventory core

  native-macos:
    name: native-macos-arm64
    # Timeout ledger (D-20): p50 17.80 min in main run 40156247875, so ceil(2 x p50) = 36; 40 keeps a margin.
    runs-on: macos-14
    timeout-minutes: 40
    needs: changes
    if: needs.changes.outputs.kind == 'full'
    env:
      # Serially the native suite took about 20 of each job's minutes; every ctest call runs 4 at once, like the floor job.
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # v02 performance self-tests read the v0.1.0 baseline commit and tag.
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable state pin base
        id: state_pin_base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            test -n "$base"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE"
            test -n "$base"
            if [ -z "${base//0/}" ]; then
              base=$(git merge-base HEAD origin/main)
            fi
          else
            echo "Unsupported CI event for immutable state pin base: $EVENT_NAME" >&2
            exit 1
          fi
          git cat-file -e "${base}^{commit}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Configure
        env:
          STATE_PIN_BASE: ${{ steps.state_pin_base.outputs.base }}
        run: |
          mkdir -p build/package-prefix
          cmake --preset phase1 -DGBB_TEST_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/package-prefix" -DGBB_STATE_PIN_BASE_REV="$STATE_PIN_BASE"
      - name: Build
        run: cmake --build --preset phase1 --verbose
      - name: Run state pins against the immutable event base
        env:
          GBB_STATE_PIN_RECEIPT: ${{ github.workspace }}/build/state-pin-receipt.json
          GBB_STATE_PLATFORM: macos-arm64
        run: ctest --test-dir build -R '^state_portable_pins$' --output-on-failure --no-tests=error
      - name: Record acceptance and Mooneye observations
        shell: bash
        run: |
          # D-33: the same observation lines must come out on every native OS at the same head.
          runner=build/gabbaboy-runner
          echo "== acceptance libbet =="
          "$runner" --acceptance tests/acceptance/cases.txt --case libbet --observe
          echo "== acceptance libbet-no-input =="
          "$runner" --acceptance tests/acceptance/cases.txt --case libbet-no-input --observe
