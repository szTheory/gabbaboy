      - name: Print no-host-clock proof
        shell: bash
        run: ctest --test-dir build -R '^no_host_clock$' --no-tests=error -V
      - name: Print DMG baseline check result
        shell: bash
        run: bash tests/scripts/verify-dmg-baseline.sh
      - name: Verify DMG baseline JUnit inventory
        shell: bash
        run: bash tests/scripts/verify-dmg-baseline.sh --junit build/ctest.xml --inventory core

  native-windows:
    name: native-windows-x64
    # Timeout ledger (D-20): p50 18.59 min in main run 40163270595; planning-time samples reached 23 min, so 50 covers ceil(2 x 23) = 46.
    runs-on: windows-2022
    timeout-minutes: 50
    needs: changes
    if: needs.changes.outputs.kind == 'full'
    env:
      # Serially the native suite took about 20 of each job's minutes; every ctest call runs 4 at once, like the floor job.
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # v02 performance self-tests read the v0.1.0 baseline commit and tag.
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable state pin base
        id: state_pin_base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            test -n "$base"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE"
            test -n "$base"
            if [ -z "${base//0/}" ]; then
              base=$(git merge-base HEAD origin/main)
            fi
          else
            echo "Unsupported CI event for immutable state pin base: $EVENT_NAME" >&2
            exit 1
          fi
          git cat-file -e "${base}^{commit}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Configure
        env:
          STATE_PIN_BASE: ${{ steps.state_pin_base.outputs.base }}
        run: |
          New-Item -ItemType Directory -Force build/package-prefix | Out-Null
          cmake --preset phase1 -DGBB_TEST_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/build/package-prefix" -DGBB_STATE_PIN_BASE_REV="$env:STATE_PIN_BASE"
      - name: Build
        run: cmake --build --preset phase1 --verbose
      - name: Run state pins against the immutable event base
        env:
          GBB_STATE_PIN_RECEIPT: ${{ github.workspace }}/build/state-pin-receipt.json
          GBB_STATE_PLATFORM: windows-x64
        run: ctest --test-dir build -R '^state_portable_pins$' --output-on-failure --no-tests=error
      - name: Record acceptance and Mooneye observations
        shell: bash
        run: |
          # D-33: the same observation lines must come out on every native OS at the same head.
          runner=build/gabbaboy-runner
          echo "== acceptance libbet =="
          "$runner" --acceptance tests/acceptance/cases.txt --case libbet --observe
          echo "== acceptance libbet-no-input =="
          "$runner" --acceptance tests/acceptance/cases.txt --case libbet-no-input --observe
          echo "== mooneye suite =="
          "$runner" --manifest fixtures/mooneye/manifest.json --suite --observe
      - name: Install package
        run: cmake --install build --prefix build/package-prefix
      - name: Capture exact Windows manifest bytes
        shell: bash
        run: bash tests/scripts/inspect-windows-manifest.sh --capture build/windows-manifest-bytes
      - name: Retain raw Windows manifest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-manifest-bytes
          path: build/windows-manifest-bytes
          if-no-files-found: error
          retention-days: 7
      - name: Run and verify required test inventory
        shell: bash
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error --output-junit ctest.xml
          bash .github/scripts/verify-test-inventory.sh build/ctest.xml tests/expected-tests.txt --installed
      - name: Retain state pin receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: state-pins-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/state-pin-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Print no-host-clock proof
        shell: bash
        run: ctest --test-dir build -R '^no_host_clock$' --no-tests=error -V
      - name: Print DMG baseline check result
        shell: bash
        run: bash tests/scripts/verify-dmg-baseline.sh
      - name: Verify DMG baseline JUnit inventory
        shell: bash
        run: bash tests/scripts/verify-dmg-baseline.sh --junit build/ctest.xml --inventory core

  linux-sanitizers:
    name: linux-asan-ubsan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.kind == 'full'
    permissions:
      actions: read
      contents: read
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # v02 performance self-tests read the v0.1.0 baseline commit and tag.
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm pinned Clang 18 toolchain
        run: |
          clang-18 --version
          clang++-18 --version
          test "$(clang-18 -dumpversion | cut -d. -f1)" = 18
          test "$(clang++-18 -dumpversion | cut -d. -f1)" = 18
      - name: Configure ASan and UBSan
        run: cmake --preset phase1-asan -DGBB_TEST_INSTALL_PREFIX=
      - name: Confirm sanitizer cache option
        run: cmake -LA -N build-asan | grep -q '^GABBABOY_ENABLE_SANITIZERS:BOOL=ON$'
      - name: Build and capture compiler/link commands
        run: cmake --build --preset phase1-asan --verbose 2>&1 | tee build-asan/build.stdout
      - name: Confirm compiler and linker sanitizer flags
        run: |
          grep -E -- '-fsanitize=address,undefined.* -c ' build-asan/build.stdout
          grep -E -- '-fsanitize=address,undefined.* -o [^ ]+ .*libgabbaboy_core' build-asan/build.stdout
          grep -F -- '-fsanitize=address,undefined' build-asan/build.ninja
      - name: Print no-host-clock proof
        shell: bash
        run: ctest --preset phase1-asan -R '^no_host_clock$' --no-tests=error -V
      - name: Verify bounded fuzz harness and deterministic reproducers
        run: |
          bash tests/scripts/run-bounded-fuzz.sh --self-test
          GBB_BUILD_DIR=build-asan bash tests/scripts/run-bounded-fuzz.sh --fast
      - name: Run and verify bounded Clang 18 campaign
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          GBB_BUILD_DIR=build-asan bash tests/scripts/run-bounded-fuzz.sh --explore --receipt build-asan/v02-fuzz-receipt.json
          campaign_status=$?
          if [[ -s build-asan/v02-fuzz-receipt.json ]]; then
            python3 -I tests/scripts/verify-v02-fuzz.py --verify build-asan/v02-fuzz-receipt.json
            verify_status=$?
            GBB_BUILD_DIR=build-asan bash tests/scripts/run-bounded-fuzz.sh --self-test
            self_test_status=$?
          else
            verify_status=1
            self_test_status=1
          fi
          set -e
          test "$campaign_status" -eq 0
          test "$verify_status" -eq 0
          test "$self_test_status" -eq 0
      - name: Retain privacy-safe bounded fuzz evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v02-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-asan/v02-fuzz-receipt.json
            build-asan/fuzz-artifacts/
          if-no-files-found: error
          retention-days: 7

  linux-sanitizers-tests:
    # The ASan inventory runs apart from the bounded fuzz campaign, split by the complementary '^acceptance_'
    # filter so each shard stays inside the original 45-minute bound and the whole ci run stays inside the preview
    # and release waiters' budgets. Each shard checks exactly its slice of tests/expected-tests.txt; together the
    # slices are the whole inventory (LESSONS GB-CI-004, GB-CI-010).
    name: linux-asan-ubsan-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.kind == 'full'
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # v02 performance self-tests read the v0.1.0 baseline commit and tag.
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm pinned Clang 18 toolchain
        run: |
          test "$(clang-18 -dumpversion | cut -d. -f1)" = 18
          test "$(clang++-18 -dumpversion | cut -d. -f1)" = 18
      - name: Configure ASan and UBSan
        run: cmake --preset phase1-asan -DGBB_TEST_INSTALL_PREFIX=
      - name: Confirm sanitizer cache option
        run: cmake -LA -N build-asan | grep -q '^GABBABOY_ENABLE_SANITIZERS:BOOL=ON$'
      - name: Build
        run: cmake --build --preset phase1-asan
      - name: Run and verify nonempty test inventory shard
        run: |
          ctest --preset phase1-asan --parallel 4 -E '^acceptance_' --output-on-failure --no-tests=error --output-junit ctest.xml
          grep -vE '^acceptance_' tests/expected-tests.txt > build-asan/expected-shard.txt
          bash .github/scripts/verify-test-inventory.sh build-asan/ctest.xml build-asan/expected-shard.txt

  linux-sanitizers-acceptance:
    # The '^acceptance_' shard of the ASan inventory (see linux-sanitizers-tests). The three full stall-replay
    # tests run in nightly-asan.yml instead (D-19); acceptance_stall_bounded keeps the drop:START negative control
    # in this PR lane.
    name: linux-asan-ubsan-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.kind == 'full'
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # v02 performance self-tests read the v0.1.0 baseline commit and tag.
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm pinned Clang 18 toolchain
        run: |
          test "$(clang-18 -dumpversion | cut -d. -f1)" = 18
          test "$(clang++-18 -dumpversion | cut -d. -f1)" = 18
      - name: Configure ASan and UBSan
        run: cmake --preset phase1-asan -DGBB_TEST_INSTALL_PREFIX=
      - name: Confirm sanitizer cache option
        run: cmake -LA -N build-asan | grep -q '^GABBABOY_ENABLE_SANITIZERS:BOOL=ON$'
      - name: Build
        run: cmake --build --preset phase1-asan
      - name: Run and verify nonempty test inventory shard
        run: |
          ctest --preset phase1-asan --parallel 4 -R '^acceptance_' -E '^acceptance_stall_diagnosis(_replay_[12])?$' --output-on-failure --no-tests=error --output-junit ctest.xml
          grep -E '^acceptance_' tests/expected-tests.txt | grep -vE '^acceptance_stall_diagnosis(_replay_[12])?$' > build-asan/expected-shard.txt
          bash .github/scripts/verify-test-inventory.sh build-asan/ctest.xml build-asan/expected-shard.txt

  cmake-floor-3-25-3:
    name: cmake-floor-3.25.3
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    needs: changes
    if: needs.changes.outputs.kind == 'full'
    env:
      # Serially the floor suite took 20-40 of these 40 minutes (LESSONS GB-CI-010); every ctest call runs 4 at once.
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # v02 performance self-tests read the v0.1.0 baseline commit and tag.
          fetch-depth: 0
          persist-credentials: false
      - name: Verify CMake 3.25.3 configure/build/test/install and relocation
        run: bash .github/scripts/verify-cmake-floor.sh

  player-gate:
    name: player-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    needs: changes
    if: needs.changes.outputs.kind == 'full'
    outputs:
      player_required: ${{ steps.decide.outputs.player_required }}
    steps:
      # The only place ci.yml decides whether macOS player package evidence is required
      # (pull_request only); macos-player-package and required-native both consume this output.
      - id: decide
        name: Decide whether player package evidence is required
        run: echo "player_required=${{ github.event_name == 'pull_request' }}" >> "$GITHUB_OUTPUT"

  macos-player-package:
    name: macos-player-package
    needs: [changes, player-gate]
    if: needs.changes.outputs.kind == 'full' && needs.player-gate.outputs.player_required == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build, test, and package the optional SDL3 player
        shell: bash
        env:
          GBB_EXPECTED_SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: bash tests/scripts/verify-phase3-player.sh --build-package
      - name: Retain run-scoped candidate for downloaded-byte verification
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3-player-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/phase3-player/preview-candidate/gabbaboy-preview-macos-arm64.tar.gz
            build/phase3-player/preview-candidate/build-receipt.json
          if-no-files-found: error
          retention-days: 1

  perf-gate:
    name: perf-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: changes
    if: needs.changes.outputs.kind == 'full'
    steps:
      - name: Check out source with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The gate builds v0.2.0 in the same job and verifies the tag, so it needs tags and history.
          fetch-depth: 0
          persist-credentials: false
      - name: Install valgrind
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y valgrind || { sleep 20; sudo apt-get update -qq; sudo apt-get install -y valgrind; }
      - name: Gate cachegrind Ir against v0.2.0 and the realtime floor
        shell: bash
        run: bash tests/scripts/run-perf-gate.sh --gate
      - name: Prove the gate rejects a seeded regression
        shell: bash
        run: bash tests/scripts/run-perf-gate.sh --seeded-regression
      - name: Prove the gate accepts a no-op twin patch
        shell: bash
        run: bash tests/scripts/run-perf-gate.sh --noop-twin
      - name: Run the release gate controls (OWNER-approved Ir exception and exact-head nightly)
        shell: bash
        run: python3 -I tests/scripts/verify-release-gates.py --self-test --rev "$GITHUB_SHA"

  required-native:
    name: required-native
    if: always()
    needs:
      - changes
      - planning-checks
      - native-linux
      - native-macos
      - native-windows
      - linux-sanitizers
      - linux-sanitizers-tests
      - linux-sanitizers-acceptance
      - cmake-floor-3-25-3
      - perf-gate
      - player-gate
      - macos-player-package
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject missing, skipped, failed, or timed-out required jobs
        env:
          KIND: ${{ needs.changes.outputs.kind }}
          CHANGES: ${{ needs.changes.result }}
          PLANNING_CHECKS: ${{ needs.planning-checks.result }}
          NATIVE_LINUX: ${{ needs.native-linux.result }}
          NATIVE_MACOS: ${{ needs.native-macos.result }}
          NATIVE_WINDOWS: ${{ needs.native-windows.result }}
          LINUX_SANITIZERS: ${{ needs.linux-sanitizers.result }}
          LINUX_SANITIZER_TESTS: ${{ needs.linux-sanitizers-tests.result }}
          LINUX_SANITIZER_ACCEPTANCE: ${{ needs.linux-sanitizers-acceptance.result }}
          CMAKE_FLOOR: ${{ needs.cmake-floor-3-25-3.result }}
          PERF_GATE: ${{ needs.perf-gate.result }}
          PLAYER_GATE: ${{ needs.player-gate.result }}
          PLAYER_REQUIRED: ${{ needs.player-gate.outputs.player_required }}
          PLAYER_RESULT: ${{ needs.macos-player-package.result }}
        run: |
          python3 -I .github/scripts/check-required-native.py
          if [[ "$KIND" != planning ]]; then
            bash .github/scripts/check-player-result.sh "$PLAYER_GATE" "$PLAYER_REQUIRED" "$PLAYER_RESULT"
          fi
